<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef } = React;

// =====================================================================
// BASELINE DATA — LottoAmerica · 3,019 draws · Sep 1996 to Apr 24 2026
// =====================================================================
const BASE_BALL_DATA = [
  [1,242,1],[2,267,29],[3,258,5],[4,268,9],[5,258,5],[6,251,13],[7,246,1],

];
const BASE_MEGA_DATA = [
  [1,117,21],[2,100,5],[3,117,81],[4,108,11],[5,85,25],[6,105,5],
  [7,113,1],[8,97,3],[9,116,13],[10,110,9],[11,100,77],[12,98,1],
  [13,103,25],[14,91,19],[15,107,7],[16,69,9],[17,81,7],[18,80,37],
  [19,82,23],[20,76,87],[21,83,23],[22,89,65],[23,61,17],[24,95,11]
];
const ENTANGLED_PAIRS = [[18,31],[29,32],[17,21],[8,10],[16,36],[4,34],[6,26],[10,40],[14,46],[31,46]];
const BASE_DRAWS    = 3019;
const BASELINE_DATE = "2026-04-24";
const API_URL       = "https://data.ny.gov/resource/5xaw-6ayf.json";

// =====================================================================
// HYPERGEOMETRIC PROBABILITY TABLE
// P(X=k) when drawing 5 from pool of 70 where 5 are "winners"
// C(70,5) = 12,607,306
// =====================================================================
const HYPER_PROB = [
  8259888/12607306,  // k=0  65.52%
  3385200/12607306,  // k=1  26.85%
   436800/12607306,  // k=2   3.46%
    20800/12607306,  // k=3   0.165%  ~1 in 606
      325/12607306,  // k=4   0.00258%  ~1 in 38,791
        1/12607306   // k=5   ~1 in 12.6M
];
const HYPER_1IN = [1.53, 3.72, 28.87, 606.1, 38791, 12607306];
const MB_PROB = 1/24;
const EXP_HITS_PER_DRAW = 5 * (5/70);  // 0.35714

function prizeTier(mainHits, mbHit) {
  if (mainHits===5 && mbHit) return {label:"JACKPOT", color:"#ffd600"};
  if (mainHits===5)          return {label:"$1,000,000", color:"#ff8c00"};
  if (mainHits===4 && mbHit) return {label:"$10,000", color:"#ff6b35"};
  if (mainHits===4)          return {label:"$500", color:"#00e676"};
  if (mainHits===3 && mbHit) return {label:"$200", color:"#00e676"};
  if (mainHits===3)          return {label:"$10", color:"#82b1ff"};
  if (mainHits===2 && mbHit) return {label:"$10", color:"#82b1ff"};
  if (mainHits===1 && mbHit) return {label:"$4", color:"#5c6bc0"};
  if (mainHits===0 && mbHit) return {label:"$2", color:"#5c6bc0"};
  return {label:"No Prize", color:"#283593"};
}

// =====================================================================
// STORAGE (localStorage with window.storage fallback for claude.ai)
// =====================================================================
var STORAGE_KEY = "mm_tracker_v1";
async function storageLoad() {
  try {
    if (window.storage && window.storage.get) {
      var r = await window.storage.get(STORAGE_KEY);
      return r ? JSON.parse(r.value) : [];
    }
  } catch(e) {}
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}
async function storageSave(data) {
  var str = JSON.stringify(data);
  try {
    if (window.storage && window.storage.set) {
      await window.storage.set(STORAGE_KEY, str);
      return;
    }
  } catch(e) {}
  try { localStorage.setItem(STORAGE_KEY, str); } catch(e) {}
}

// =====================================================================
// BALL DATA CACHE
// The pre-Babel <script> block already read localStorage into window.__mmCache.
// We just reference that here so Babel picks it up at the right time.
// saveBallCache writes to BOTH localStorage AND window.__mmCache.
// =====================================================================
var BALL_CACHE_KEY = "mm_ball_cache_v2";

function saveBallCache(balls, mega, lastDate, total, recentWindow) {
  var payload = {
    balls:balls, mega:mega, lastDate:lastDate, total:total,
    recentWindow: recentWindow || [],
    savedAt:Date.now()
  };
  try { localStorage.setItem(BALL_CACHE_KEY, JSON.stringify(payload)); } catch(e) {}
  window.__mmCache = payload;
}

// Always null — picks always come from live API, never from stale cache
var _initCache = null;

// =====================================================================
// LIVE FETCH & MERGE
// =====================================================================
async function fetchNewDrawings() {
  // Fetch all draws post-baseline plus latest 30 for the recent window
  var url = API_URL + "?$order=draw_date%20DESC&$limit=200";
  var res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  var data = await res.json();
  var sorted = data.sort(function(a,b){ return a.draw_date.localeCompare(b.draw_date); });
  // newDraws = strictly after our baseline cutoff
  var newDraws = sorted.filter(function(d){ return (d.draw_date||"").substring(0,10) > BASELINE_DATE; });
  // recentWindow = last 30 draws from API (may overlap with baseline — that's fine)
  var recentWindow = sorted.slice(-30);
  return { newDraws: newDraws, recentWindow: recentWindow };
}

function parseRawDraw(d) {
  return {
    balls: (d.winning_numbers||"").trim().split(/\s+/).map(Number).filter(function(n){return n>=1&&n<=70;}),
    mega:  parseInt(d.mega_ball||"0", 10),
    date:  (d.draw_date||"").substring(0,10)
  };
}
function mergeDrawings(newDraws) {
  var bm={}, mm={};
  BASE_BALL_DATA.forEach(function(r){ bm[r[0]]=[r[0],r[1],r[2]]; });
  BASE_MEGA_DATA.forEach(function(r){ mm[r[0]]=[r[0],r[1],r[2]]; });
  var total=newDraws.length;
  if(total===0) return {balls:Object.values(bm),mega:Object.values(mm)};

  // Track last draw index (0=oldest, total-1=newest) each ball appeared in
  var lastSeenBall={}, lastSeenMB={};
  newDraws.forEach(function(d,idx){
    var balls=(d.winning_numbers||"").trim().split(/\s+/).map(Number).filter(function(n){return n>=1&&n<=70;});
    var mega=parseInt(d.mega_ball||"0",10);
    balls.forEach(function(n){ if(bm[n]){ bm[n][1]+=1; lastSeenBall[n]=idx; } });
    if(mm[mega]){ mm[mega][1]+=1; lastSeenMB[mega]=idx; }
  });

  // Update drawsAgo for ALL balls:
  //   In new draws: ago = total - lastSeenIdx   (1 = drawn in most recent draw)
  //   Not in any new draw: ago += total          (has been that many more draws since last seen)
  Object.values(bm).forEach(function(entry){
    if(lastSeenBall[entry[0]]!==undefined){ entry[2]=total-lastSeenBall[entry[0]]; }
    else { entry[2]+=total; }
  });
  Object.values(mm).forEach(function(entry){
    if(lastSeenMB[entry[0]]!==undefined){ entry[2]=total-lastSeenMB[entry[0]]; }
    else { entry[2]+=total; }
  });

  return {balls:Object.values(bm), mega:Object.values(mm)};
}

// =====================================================================
// LOGISTIC OVERDUE RATIO  (the core responsive signal)
//
//   raw_ratio(ball) = drawsAgo * freq / TOTAL_DRAWS
//                   = drawsAgo / expected_gap
//
//   expected_gap = TOTAL_DRAWS / freq  (ball's own historical return rate)
//
//   raw_ratio > 1.0 means ball is past its expected return interval
//   raw_ratio = 6.8 means ball is 6.8x overdue vs its own history
//
//   logistic(r) = r / (1 + r)  → bounded [0,1), diminishing returns
//   This prevents any single extremely-overdue ball from permanently
//   dominating, while still correctly ranking overdue balls highest.
//
//   Critically: when a ball IS drawn, drawsAgo → 1, ratio drops to
//   freq/TOTAL ≈ 0.08, logistic ≈ 0.07. Pick falls out of top 5.
//   This is what makes picks change every draw.
// =====================================================================
function logisticOverdue(freq, ago, totalDraws) {
  var ratio = (ago * freq) / totalDraws;  // normalised by ball's own rate
  return ratio / (1 + ratio);             // logistic [0,1)
}

// buildRecentMap: simple hit counter for display metrics only
function buildRecentMap(recentDraws, isMega) {
  var hitMap={}, W=recentDraws.length;
  recentDraws.forEach(function(d){
    var nums=isMega?[d.mega]:(d.balls||[]);
    nums.forEach(function(n){if(n>=1)hitMap[n]=(hitMap[n]||0)+1;});
  });
  return{hitMap:hitMap,W:W};
}

// =====================================================================
// MODEL 1 — NAVIER-STOKES FLUID DYNAMICS
//
//   Uses logistic_overdue as velocity v — the physically correct signal:
//   a ball normalised far past its expected return gap has high "pressure".
//
//   P  = freq / fMean          (historical frequency weight)
//   v  = logistic_overdue      (normalised overdue signal, [0,1))
//   Re = ρvL/μ                 (Reynolds number, turbulence)
//   B  = P + ½ρv²              (Bernoulli total energy)
//   Score = equal-weight normalised ensemble: (Pn + vn + Bn) / 3
//
//   Picks change when any top-5 ball is drawn (its v drops from ~0.87
//   to ~0.07), allowing the next-ranked ball to enter the top 5.
// =====================================================================
function modelFluid(data, pool, bpd, recentDraws, totalDraws) {
  var td = totalDraws || 3019;
  var freqs=data.map(function(d){return d[1];});
  var fMean=freqs.reduce(function(a,b){return a+b;},0)/freqs.length;
  var fMax=Math.max.apply(null,freqs), fMin=Math.min.apply(null,freqs);
  var rm=buildRecentMap(recentDraws||[], false);

  var raw=data.map(function(r){
    var num=r[0],freq=r[1],ago=r[2];
    var P=freq/fMean;
    var v=logisticOverdue(freq,ago,td);   // normalised by ball's own frequency
    var Re=(v*pool)/0.08;
    var B=P+0.5*v*v;
    var w=Math.abs(P-1);
    return{num:num,freq:freq,ago:ago,P:P,v:v,Re:Re,B:B,w:w};
  });

  var Pmax=Math.max.apply(null,raw.map(function(r){return r.P;}));
  var Pmin=Math.min.apply(null,raw.map(function(r){return r.P;}));
  var vmax=Math.max.apply(null,raw.map(function(r){return r.v;}));
  var Bmax=Math.max.apply(null,raw.map(function(r){return r.B;}));
  var Bmin=Math.min.apply(null,raw.map(function(r){return r.B;}));

  return raw.map(function(r){
    var Pn=(Pmax>Pmin)?(r.P-Pmin)/(Pmax-Pmin):0.5;
    var vn=(vmax>0)?r.v/vmax:0;
    var Bn=(Bmax>Bmin)?(r.B-Bmin)/(Bmax-Bmin):0.5;
    var score=(Pn+vn+Bn)/3;
    var regime=r.Re>4000?"turbulent":r.Re>2300?"transitional":"laminar";
    var rawRatio=(r.ago*r.freq)/td;
    return{
      num:r.num,freq:r.freq,ago:r.ago,score:score,
      P:r.P,v:r.v,Re:r.Re,B:r.B,w:r.w,regime:regime,
      recentHits:rm.hitMap[r.num]||0,
      metrics:[
        ["Overdue ratio", rawRatio.toFixed(3)+" ("+r.ago+"draws)"],
        ["Velocity v",    r.v.toFixed(4)],
        ["Pressure P",    r.P.toFixed(4)],
        ["Reynolds Re",   Math.round(r.Re)],
        ["Bernoulli B",   r.B.toFixed(4)],
        ["Recent hits",   (rm.hitMap[r.num]||0)+"/"+rm.W],
        ["NS-Score",      score.toFixed(5)]
      ]
    };
  });
}

// =====================================================================
// MODEL 2 — SMART PLAY  (EV Maximisation + Statistical Timing)
//
//   EV component (60%):  score_ev  = -log(popularity(n))  [derived]
//     Maximises E[payout|win] by minimising Σpop(i)
//     Continuous Gaussian popularity model — all 70 balls distinct
//
//   Timing component (40%): logistic_overdue(n)  [statistical]
//     Selects from unpopular balls those most statistically due
//     Makes picks responsive to new draw results
//
//   Score = 0.60 * norm(ev) + 0.40 * logistic_overdue
// =====================================================================
function modelSmart(data, pool, bpd, totalDraws, recentDraws) {
  var td=totalDraws||3019;

  function popularity(n){
    var base=1.0+1.2*Math.exp(-Math.pow(n-1,2)/(2*22*22));
    var r5=n%5===0?0.25:0;
    var r10=n%10===0?0.15:0;
    var lucky={7:0.60,11:0.45,13:0.35,17:0.35,21:0.30,23:0.25,
               3:0.20,9:0.15,27:0.15,33:0.10,37:0.10,42:0.10,69:0.15};
    var lb=lucky[n]||0;
    var age=[18,21,25,30,35,40,45,50,55,60,65];
    var ab=age.indexOf(n)>=0?0.08:0;
    return base+r5+r10+lb+ab;
  }

  // Pre-compute EV normalisation range
  var evRaw=data.map(function(r){return -Math.log(popularity(r[0]));});
  var evMin=Math.min.apply(null,evRaw), evMax=Math.max.apply(null,evRaw);
  var evRange=evMax-evMin||1;

  var rm=buildRecentMap(recentDraws||[], false);

  return data.map(function(r){
    var num=r[0],freq=r[1],ago=r[2];
    var pop=popularity(num);
    var evNorm=(-Math.log(pop)-evMin)/evRange;          // [0,1]
    var ov=logisticOverdue(freq,ago,td);                // [0,1)
    var score=0.60*evNorm+0.40*ov;
    var tag=pop>2.0?"Overplayed":pop>1.4?"Popular":pop>1.1?"Mild":"Contrarian";
    return{
      num:num,freq:freq,ago:ago,score:score,pop:pop,tag:tag,
      recentHits:rm.hitMap[num]||0,
      metrics:[
        ["Popularity",    pop.toFixed(4)],
        ["-log(pop) norm",evNorm.toFixed(4)],
        ["Overdue v",     ov.toFixed(4)],
        ["EV score",      score.toFixed(4)],
        ["Recent hits",   (rm.hitMap[num]||0)+"/"+rm.W],
        ["Tag",           tag]
      ]
    };
  });
}

// =====================================================================
// MODEL 3 — QUANTUM ENTANGLEMENT
//
//   Phase θ uses normalised overdue ratio (not just ago/ei):
//   θ = 2π × logistic_overdue  (ranges 0→2π as ball becomes more overdue)
//
//   Wave function amplitude: |ψ| = √(freq/total)
//   Probability: P = |ψ|² × (1 + cos(θ)/2)  [interference]
//   Decoherence: D = exp(−2×logistic_overdue)  [collapse after drawing]
//   Tunneling: T = exp(−κ×barrier)
//   Score = P×D + T + entanglement
// =====================================================================
function modelQuantum(data, pool, bpd, recentDraws, totalDraws) {
  var td=totalDraws||3019;
  var freqs=data.map(function(d){return d[1];});
  var fTotal=freqs.reduce(function(a,b){return a+b;},0);
  var fMean=fTotal/data.length;
  var kappa=1.8;

  var eB={};
  ENTANGLED_PAIRS.forEach(function(p){
    eB[p[0]]=(eB[p[0]]||0)+0.08;
    eB[p[1]]=(eB[p[1]]||0)+0.08;
  });

  var rm=buildRecentMap(recentDraws||[], false);

  return data.map(function(r){
    var num=r[0],freq=r[1],ago=r[2];

    var amp=Math.sqrt(freq/fTotal);
    var ov=logisticOverdue(freq,ago,td);
    // Phase tied to normalised overdue ratio → responsive to new draws
    var theta=2*Math.PI*ov;

    var psiR=amp*Math.cos(theta), psiI=amp*Math.sin(theta);
    var prob=(psiR*psiR+psiI*psiI)*(1+Math.cos(theta)/2);

    // Decoherence: high when just drawn (ov≈0), low when very overdue (ov→1)
    // D = exp(−2×ov): just drawn D→1 but prob→0; overdue D→0.14 but prob→high
    // Natural balance without ad-hoc constants
    var decoh=Math.exp(-2*ov);

    var barrier=Math.max(fMean-freq,0)/fMean;
    var tunnel=Math.exp(-kappa*barrier)*0.12;
    var entangle=eB[num]||0;

    var score=prob*decoh+tunnel+entangle;

    var state=ov<0.1?"COLLAPSED":
              Math.cos(theta)>0.3?"RESONANT":
              Math.cos(theta)<-0.3?"DESTRUCTIVE":"SUPERPOSED";

    return{
      num:num,freq:freq,ago:ago,score:score,
      amplitude:amp,theta:theta,interference:Math.cos(theta),
      decoherence:decoh,tunneling:tunnel,entanglement:entangle,state:state,
      recentHits:rm.hitMap[num]||0,
      metrics:[
        ["Overdue ratio", ((ago*freq)/td).toFixed(3)],
        ["Phase θ",       theta.toFixed(4)],
        ["Amplitude|ψ|",  amp.toFixed(5)],
        ["Interference",  Math.cos(theta).toFixed(4)],
        ["Decoherence D", decoh.toFixed(4)],
        ["Recent hits",   (rm.hitMap[num]||0)+"/"+rm.W],
        ["QE Score",      score.toFixed(5)]
      ]
    };
  });
}


function applyBalanceFilter(cands){
  // Smart Play scores are -log(pop) — all negative, most negative = most unpopular
  // Normalise scores to [0,1] before combining with balance criteria
  var scoreMin = Math.min.apply(null, cands.map(function(s){return s.score;}));
  var scoreMax = Math.max.apply(null, cands.map(function(s){return s.score;}));
  var scoreRange = scoreMax - scoreMin || 1;
  var top12 = cands.slice(0,12);
  var scoreMap12 = {};
  top12.forEach(function(s){
    scoreMap12[s.num] = (s.score - scoreMin) / scoreRange; // normalise to [0,1]
  });
  var nums12 = top12.map(function(s){return s.num;});
  var best=null, bestB=-Infinity;
  for(var a=0;a<nums12.length;a++)
  for(var b=a+1;b<nums12.length;b++)
  for(var c=b+1;c<nums12.length;c++)
  for(var d=c+1;d<nums12.length;d++)
  for(var e=d+1;e<nums12.length;e++){
    var cb=[nums12[a],nums12[b],nums12[c],nums12[d],nums12[e]];
    var sum=cb.reduce(function(x,y){return x+y;},0);
    var odds=cb.filter(function(n){return n%2!==0;}).length;
    var lows=cb.filter(function(n){return n<=35;}).length;
    var ts=cb.reduce(function(x,n){return x+(scoreMap12[n]||0);},0);
    // Balance score: each criterion has equal weight (1/3 each)
    var balanceBonus = ((sum>=100&&sum<=175?1:0) + (odds>=2&&odds<=3?1:0) + (lows>=2&&lows<=3?1:0)) / 3;
    var bal = balanceBonus + ts / nums12.length;
    if(bal>bestB){bestB=bal;best=cb;}
  }
  return best?best.sort(function(a,b){return a-b;}):cands.slice(0,5).map(function(s){return s.num;}).sort(function(a,b){return a-b;});
}

function TrackerTab(props){
  var currentPreds=props.currentPreds;
  var history=props.history, setHistory=props.setHistory;
  var lastDrawDate=props.lastDrawDate||"";
  var newDrawsFound=props.newDrawsFound||0;

  var showFormState=useState(false);
  var showForm=showFormState[0], setShowForm=showFormState[1];

  var formState=useState({
    date:"2026-05-08",
    m1:"37",m2:"47",m3:"49",m4:"51",m5:"58",mb:"16",
    capturePreds:true,
    // pre-fill with currentPreds
    fp1:"",fp2:"",fp3:"",fp4:"",fp5:"",fmb:"",
    sp1:"",sp2:"",sp3:"",sp4:"",sp5:"",smb:"",
    qp1:"",qp2:"",qp3:"",qp4:"",qp5:"",qmb:""
  });
  var form=formState[0], setForm=formState[1];

  var errState=useState("");
  var err=errState[0], setErr=errState[1];

  // When form opens, pre-fill predictions from current model picks
  function openForm(){
    var p=currentPreds;
    // Use lastDrawDate as the default date (most likely what user is logging)
    var defaultDate = lastDrawDate || formState[0].date;
    setForm(function(prev){
      return Object.assign({},prev,{
        date: defaultDate,
        // Pre-fill predictions from CURRENT model picks (reflect latest merged data)
        fp1:String(p[0].main[0]),fp2:String(p[0].main[1]),fp3:String(p[0].main[2]),fp4:String(p[0].main[3]),fp5:String(p[0].main[4]),fmb:String(p[0].mega),
        sp1:String(p[1].main[0]),sp2:String(p[1].main[1]),sp3:String(p[1].main[2]),sp4:String(p[1].main[3]),sp5:String(p[1].main[4]),smb:String(p[1].mega),
        qp1:String(p[2].main[0]),qp2:String(p[2].main[1]),qp3:String(p[2].main[2]),qp4:String(p[2].main[3]),qp5:String(p[2].main[4]),qmb:String(p[2].mega)
      });
    });
    setShowForm(true);
  }

  function upd(field,val){ setForm(function(prev){var o=Object.assign({},prev);o[field]=val;return o;}); }

  function validateAndAdd(){
    var actual=[parseInt(form.m1),parseInt(form.m2),parseInt(form.m3),parseInt(form.m4),parseInt(form.m5)];
    var actMB=parseInt(form.mb);
    if(actual.some(isNaN)||isNaN(actMB)){setErr("Enter all 5 winning numbers + Mega Ball");return;}
    if(actual.some(function(n){return n<1||n>70;})){setErr("Main numbers must be 1-70");return;}
    if(actMB<1||actMB>24){setErr("Mega Ball must be 1-24");return;}
    if(new Set(actual).size!==5){setErr("Main numbers must all be different");return;}
    if(!form.date){setErr("Enter draw date");return;}

    var preds=[
      {model:"fluid",  main:[form.fp1,form.fp2,form.fp3,form.fp4,form.fp5].map(Number),mega:parseInt(form.fmb)||0},
      {model:"smart",  main:[form.sp1,form.sp2,form.sp3,form.sp4,form.sp5].map(Number),mega:parseInt(form.smb)||0},
      {model:"quantum",main:[form.qp1,form.qp2,form.qp3,form.qp4,form.qp5].map(Number),mega:parseInt(form.qmb)||0}
    ];

    var entry={
      id:Date.now()+"",
      date:form.date,
      actual:{main:actual.sort(function(a,b){return a-b;}),mega:actMB},
      preds:preds
    };
    var updated=[entry].concat(history);
    storageSave(updated);
    setHistory(updated);
    setShowForm(false);
    setErr("");
  }

  function removeEntry(id){
    var updated=history.filter(function(h){return h.id!==id;});
    storageSave(updated);
    setHistory(updated);
  }

  // Compute stats per model
  function computeStats(){
    var models=["fluid","smart","quantum"];
    var result={};
    models.forEach(function(model){
      var relevant=history.filter(function(h){
        return h.preds.some(function(p){return p.model===model&&p.main&&p.main.length===5;});
      });
      var totalHits=0,totalMBHits=0,hitDist=[0,0,0,0,0,0];
      relevant.forEach(function(h){
        var pred=h.preds.filter(function(p){return p.model===model;})[0];
        if(!pred||!pred.main||pred.main.length!==5)return;
        var hits=pred.main.filter(function(n){return h.actual.main.indexOf(n)>=0;}).length;
        var mbHit=pred.mega===h.actual.mega?1:0;
        totalHits+=hits;
        totalMBHits+=mbHit;
        if(hits<=5)hitDist[hits]++;
      });
      var n=relevant.length;
      var avgHits=n>0?totalHits/n:0;
      var avgMB=n>0?totalMBHits/n:0;
      result[model]={
        n:n,totalHits:totalHits,totalMBHits:totalMBHits,
        avgHits:avgHits,avgMB:avgMB,hitDist:hitDist,
        perfRatio:n>0?avgHits/EXP_HITS_PER_DRAW:null,
        mbRatio:n>0?(avgMB/MB_PROB):null,
        expectedTotalHits:n*EXP_HITS_PER_DRAW,
        expectedMBHits:n*MB_PROB
      };
    });
    return result;
  }
  var stats=computeStats();

  var modelColors=["#00e5ff","#00e676","#e040fb"];
  var modelNames=["Fluid","Smart","Quantum"];

  function NumberInput(props){
    var f=props.field,v=form[f]||"",min=props.min||1,max=props.max||70,w=props.w||"44px";
    return (
      <input type="number" min={min} max={max} value={v}
        onChange={function(e){upd(f,e.target.value);}}
        style={{width:w,background:"#030e1e",border:"1px solid rgba(0,160,255,0.3)",
          color:"#82b1ff",borderRadius:"4px",padding:"4px 2px",
          textAlign:"center",fontSize:"12px",outline:"none"}}/>
    );
  }

  var panelTracker=mkPanel("tracker");
  var lblTracker=mkLbl(TH.tracker.p);

  // Check if this draw date is already logged
  var alreadyLogged = history.some(function(h){ return h.date===lastDrawDate; });
  var showNewDrawBanner = newDrawsFound>0 && lastDrawDate && !alreadyLogged;

  return (
    <div style={{position:"relative",zIndex:1}}>

      {/* New draw banner */}
      {showNewDrawBanner && (
        <div style={{background:"rgba(0,60,20,0.8)",border:"1px solid rgba(0,220,100,0.5)",
          borderRadius:"6px",padding:"10px 14px",marginBottom:"10px",
          display:"flex",alignItems:"center",justifyContent:"space-between",
          flexWrap:"wrap",gap:"8px",animation:"flowIn 0.4s ease"}}>
          <div>
            <div style={{fontSize:"10px",color:"#00e676",fontWeight:"bold",letterSpacing:"0.12em"}}>
              &#9679; {newDrawsFound} NEW DRAW{newDrawsFound!==1?"S":""} DETECTED
            </div>
            <div style={{fontSize:"8px",color:"#4a8a5a",marginTop:"2px"}}>
              Latest: {lastDrawDate} · Log the result to track model performance
            </div>
          </div>
          <button onClick={openForm} style={{
            padding:"6px 16px",fontSize:"8px",letterSpacing:"0.15em",textTransform:"uppercase",
            background:"rgba(0,200,80,0.2)",border:"1px solid rgba(0,220,100,0.7)",
            color:"#00e676",borderRadius:"4px",cursor:"pointer",fontFamily:"inherit"}}>
            LOG DRAW &#9658;
          </button>
        </div>
      )}

      {/* Stats Panel */}
      <div style={{...panelTracker,marginBottom:"12px"}}>
        <span style={lblTracker}>Model Performance vs Expected Odds</span>

        {history.length===0 ? (
          <div style={{textAlign:"center",padding:"16px 0",fontSize:"9px",color:"#5a8055",letterSpacing:"0.15em"}}>
            No draws logged yet. Log your first draw result to start tracking.
          </div>
        ) : (
          <div>
            {/* Per-model stat cards */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"8px",marginBottom:"12px"}}>
              {["fluid","smart","quantum"].map(function(model,mi){
                var s=stats[model];
                var pr=s.perfRatio;
                var mbr=s.mbRatio;
                var c=modelColors[mi];
                var perfColor=pr===null?"#6898c0":pr>1.5?"#00e676":pr>0.5?"#ffab40":"#ff6b35";
                var mbColor=mbr===null?"#6898c0":mbr>1.5?"#00e676":mbr>0.5?"#ffab40":"#ff6b35";
                return (
                  <div key={model} style={{background:"rgba(0,10,25,0.8)",
                    border:"1px solid "+c+"33",borderRadius:"6px",padding:"10px"}}>
                    <div style={{fontSize:"9px",color:c,fontWeight:"bold",letterSpacing:"0.1em",marginBottom:"8px"}}>
                      {modelNames[mi]}
                    </div>

                    {s.n===0 ? (
                      <div style={{fontSize:"8px",color:"#4a7898"}}>No data yet</div>
                    ) : (
                      <div>
                        {/* Main numbers */}
                        <div style={{marginBottom:"6px"}}>
                          <div style={{fontSize:"7px",color:"#4a7898",letterSpacing:"0.15em",marginBottom:"3px"}}>MAIN NUMBERS</div>

                            <span style={{fontSize:"8px",color:"#6898c0"}}>Total hits</span>

                          <div style={{display:"flex",justifyContent:"space-between",marginBottom:"2px"}}>
                            <span style={{fontSize:"8px",color:"#6898c0"}}>Avg per draw</span>

                          <div style={{display:"flex",justifyContent:"space-between",marginBottom:"4px"}}>
                            <span style={{fontSize:"8px",color:"#6898c0"}}>Expected (chance)</span>

                            <span style={{fontSize:"8px",color:"#6898c0",fontWeight:"bold"}}>PERFORMANCE</span>

                        {/* Mega ball */}
                        <div style={{marginBottom:"6px"}}>
                          <div style={{fontSize:"7px",color:"#4a7898",letterSpacing:"0.15em",marginBottom:"3px"}}>MEGA BALL</div>
                          <div style={{display:"flex",justifyContent:"space-between",marginBottom:"2px"}}>
                            <span style={{fontSize:"8px",color:"#6898c0"}}>Hits / draws</span>
                            <span style={{fontSize:"9px",color:"#ffd600"}}>{s.totalMBHits} / {s.n}</span>

                          <div style={{display:"flex",justifyContent:"space-between",marginBottom:"4px"}}>

                            <span style={{fontSize:"11px",color:mbColor,fontWeight:"bold"}}>

                            </span>
                          </div>

                        {/* Hit distribution */}
                        <div>
                          <div style={{fontSize:"7px",color:"#4a7898",letterSpacing:"0.15em",marginBottom:"3px"}}>HIT DISTRIBUTION</div>

              <div style={{marginTop:"6px",fontSize:"8px",color:"#4a7898",lineHeight:1.8}}>

          transition:"all 0.2s",display:"flex",alignItems:"center",gap:"6px"}}>
          <span style={{fontSize:"14px"}}>+</span> LOG DRAW RESULT
        </button>

      {showForm&&(

                    <div style={{display:"flex",gap:"6px",alignItems:"center"}}>
                      {/* Actual balls */}
                      <div style={{display:"flex",gap:"3px",alignItems:"center"}}>
                        {h.actual.main.map(function(n){
                          return (
                            <div key={n} style={{width:"26px",height:"26px",borderRadius:"50%",
                              background:"#0a1428",border:"1px solid rgba(255,171,64,0.5)",
                              display:"flex",alignItems:"center",justifyContent:"center",
                              fontSize:"9px",fontWeight:"bold",color:TH.tracker.p}}>{n}</div>
                          );
                        })}
                        <div style={{width:"26px",height:"26px",borderRadius:"50%",
                          background:"#1a0800",border:"1px solid #ffd600",
                          display:"flex",alignItems:"center",justifyContent:"center",
                          fontSize:"9px",fontWeight:"bold",color:"#ffd600",marginLeft:"3px"}}>{h.actual.mega}</div>
                      </div>
                      <button onClick={function(){removeEntry(h.id);}} style={{
                        padding:"2px 8px",fontSize:"8px",background:"transparent",
                        border:"1px solid rgba(100,50,50,0.4)",color:"#4a2020",
                        borderRadius:"3px",cursor:"pointer",fontFamily:"inherit"}}>remove</button>
                    </div>
                  </div>

                  {/* Model results */}
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"6px"}}>
                    {h.preds.map(function(pred,mi){
                      if(!pred||!pred.main||pred.main.length!==5)return null;
                      var modelColor=modelColors[mi];
                      var hits=pred.main.filter(function(n){return h.actual.main.indexOf(n)>=0;}).length;
                      var mbHit=pred.mega===h.actual.mega;
                      var prize=prizeTier(hits,mbHit);
                      return (
                        <div key={pred.model} style={{background:"rgba(0,15,35,0.7)",
                          border:"1px solid "+modelColor+"22",borderRadius:"4px",padding:"7px"}}>
                          <div style={{fontSize:"8px",color:modelColor,letterSpacing:"0.08em",marginBottom:"5px",fontWeight:"bold"}}>
                            {modelNames[mi]}
                          </div>
                          <div style={{display:"flex",gap:"2px",flexWrap:"wrap",marginBottom:"4px"}}>
                            {pred.main.map(function(n){
                              var isHit=h.actual.main.indexOf(n)>=0;
                              return (
                                <div key={n} style={{width:"22px",height:"22px",borderRadius:"50%",
                                  background:isHit?"rgba(0,200,100,0.2)":"rgba(0,0,0,0.3)",
                                  border:"1px solid "+(isHit?"#00e676":"rgba(100,100,100,0.2)"),
                                  display:"flex",alignItems:"center",justifyContent:"center",
                                  fontSize:"8px",fontWeight:isHit?"bold":"normal",
                                  color:isHit?"#00e676":"#5080a8"}}>{n}</div>
                              );
                            })}
                            <div style={{width:"22px",height:"22px",borderRadius:"50%",
                              background:mbHit?"rgba(255,214,0,0.2)":"rgba(0,0,0,0.3)",
                              border:"1px solid "+(mbHit?"#ffd600":"rgba(100,100,100,0.2)"),
                              display:"flex",alignItems:"center",justifyContent:"center",
                              fontSize:"8px",fontWeight:mbHit?"bold":"normal",
                              color:mbHit?"#ffd600":"#5080a8",marginLeft:"2px"}}>{pred.mega}</div>
                          </div>
                          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                            <span style={{fontSize:"9px",fontWeight:"bold",
                              color:hits>=3?"#00e676":hits>=1?"#ffab40":"#5080a8"}}>
                              {hits}/5 {mbHit?"+MB":""}
                            </span>
                            <span style={{fontSize:"8px",color:prize.color,fontWeight:hits>=3?"bold":"normal"}}>
                              {prize.label}
                            </span>
                          </div>
                          {hits>=2&&(
                            <div style={{fontSize:"7px",color:"#4a7898",marginTop:"2px"}}>
                              1-in-{HYPER_1IN[hits]<100?HYPER_1IN[hits].toFixed(1):Math.round(HYPER_1IN[hits]).toLocaleString()} by chance
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// =====================================================================
// ROOT APP
// =====================================================================
function App(){
  // Use cached data if available for instant display, fall back to baseline
  // Always start from baseline — picks come from live API fetch, never from stale cache
  var bS=useState(BASE_BALL_DATA); var balls=bS[0],setBalls=bS[1];
  var mS=useState(BASE_MEGA_DATA); var mega=mS[0],setMega=mS[1];
  var rdS=useState([]);            var recentDraws=rdS[0],setRecentDraws=rdS[1];
  var stS=useState("loading");     var appStatus=stS[0],setAppStatus=stS[1];
  var iS=useState({totalLoaded:0,lastDrawDate:BASELINE_DATE,lastChecked:null,
    newOnRefresh:null,phase:"loading",total:BASE_DRAWS,error:null});
  var info=iS[0],setInfo=iS[1];
  var rS=useState(false);          var refreshing=rS[0],setRefreshing=rS[1];
  var lastLoadedDateRef=useRef(BASELINE_DATE);
  var tS=useState("compare");      var tab=tS[0],setTab=tS[1];
  var seS=useState(null);          var sel=seS[0],setSel=seS[1];
  var eS=useState(false);          var showEV=eS[0],setShowEV=eS[1];
  var tkS=useState(0);             var tick=tkS[0],setTick=tkS[1];
  var hpS=useState(false);          var showHelp=hpS[0],setShowHelp=hpS[1];
  var hS=useState([]);             var history=hS[0],setHistory=hS[1];

  useEffect(function(){var id=setInterval(function(){setTick(function(t){return t+1;});},2000);return function(){clearInterval(id);};}, []);

  // Load tracker history from storage
  useEffect(function(){
    storageLoad().then(function(data){setHistory(Array.isArray(data)?data:[]);});
  },[]);

  function doFetch(isRefresh){
    if(isRefresh)setRefreshing(true);
    fetchNewDrawings().then(function(result){
      var nd=result.newDraws;
      var recentParsed=result.recentWindow.map(parseRawDraw);
      var latestDate=nd.length>0?nd[nd.length-1].draw_date.substring(0,10):lastLoadedDateRef.current;
      var newSinceLast=nd.filter(function(d){
        return (d.draw_date||"").substring(0,10)>lastLoadedDateRef.current;
      }).length;
      if(nd.length>0){
        var m=mergeDrawings(nd);
        setBalls(m.balls);
        setMega(m.mega);
        saveBallCache(m.balls, m.mega, latestDate, BASE_DRAWS+nd.length, recentParsed);
      }
      // If nd.length===0: no new draws since baseline — no cache update needed
      setRecentDraws(recentParsed);
      lastLoadedDateRef.current=latestDate;
      setInfo({
        totalLoaded:nd.length,
        total:BASE_DRAWS+nd.length,
        lastDrawDate:latestDate,
        lastChecked:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),
        newOnRefresh:isRefresh?newSinceLast:null,
        // Phase: always "loaded" after merge — "new_draws" only for truly new data
        phase:isRefresh?(newSinceLast>0?"new_draws":"synced"):"loaded",
        error:null
      });
      setAppStatus("ready");
      if(isRefresh)setRefreshing(false);
    }).catch(function(e){
      setInfo(function(prev){return Object.assign({},prev,{phase:"error",error:e.message});});
      setAppStatus("ready");
      if(isRefresh)setRefreshing(false);
    });
  }
  useEffect(function(){doFetch(false);},[]);

  // Models now receive recentDraws as 4th arg — this is what makes picks responsive
  var fB=useMemo(function(){return modelFluid(balls,70,5,recentDraws,info.total);},[balls,recentDraws,info.total]);
  var sB=useMemo(function(){return modelSmart(balls,70,5,info.total,recentDraws);},[balls,info.total,recentDraws]);
  var qB=useMemo(function(){return modelQuantum(balls,70,5,recentDraws,info.total);},[balls,recentDraws,info.total]);
  var fM=useMemo(function(){return modelFluid(mega,24,1,recentDraws,info.total);},[mega,recentDraws,info.total]);
  var sM=useMemo(function(){return modelSmart(mega,24,1,info.total,recentDraws);},[mega,info.total,recentDraws]);
  var qM=useMemo(function(){return modelQuantum(mega,24,1,recentDraws,info.total);},[mega,recentDraws,info.total]);

  var preds=useMemo(function(){
    var fTop=[...fB].sort(function(a,b){return b.score-a.score;});
    var sTop=[...sB].sort(function(a,b){return b.score-a.score;});
    var qTop=[...qB].sort(function(a,b){return b.score-a.score;});
    return [
      {main:fTop.slice(0,5).map(function(s){return s.num;}).sort(function(a,b){return a-b;}),mega:[...fM].sort(function(a,b){return b.score-a.score;})[0].num},
      {main:applyBalanceFilter(sTop),mega:[...sM].sort(function(a,b){return b.score-a.score;})[0].num},
      {main:qTop.slice(0,5).map(function(s){return s.num;}).sort(function(a,b){return a-b;}),mega:[...qM].sort(function(a,b){return b.score-a.score;})[0].num}
    ];
  },[fB,sB,qB,fM,sM,qM]);

  var allS=[fB,sB,qB],allM=[fM,sM,qM];

  if(appStatus==="loading"){
    return (
      <div style={{background:"#020812",minHeight:"100vh",display:"flex",flexDirection:"column",
        alignItems:"center",justifyContent:"center",fontFamily:"'Courier New',monospace"}}>
        <div style={{fontSize:"15px",fontWeight:"900",color:"#00b8ff",letterSpacing:"0.15em"}}>Loading&#8230;</div>
      </div>
    );
  }

  var dotColor = info.phase==="error"  ? "#ff6b35"
              : info.phase==="new_draws" ? "#00e676"
              : info.totalLoaded>0       ? "#00e676"
              :                            "#448aff";
  var apiDrawsMsg = info.totalLoaded > 0
    ? info.totalLoaded+" DRAW"+(info.totalLoaded!==1?"S":"")+" SINCE "+BASELINE_DATE+" · LATEST: "+info.lastDrawDate
    : "NO NEW DRAWS FOUND AFTER "+BASELINE_DATE+" (API MAY LAG UP TO 24H)";
  var dotMsg = info.phase==="error"     ? "API ERROR — USING BASELINE"
             : info.phase==="new_draws" ? info.newOnRefresh+" NEW DRAW"+(info.newOnRefresh!==1?"S":"")+
                                          " ADDED · PICKS UPDATED · "+apiDrawsMsg
             : info.phase==="loaded"    ? "MODELS COMPUTED · "+apiDrawsMsg
             : info.phase==="synced"    ? "API SYNCED "+info.lastChecked+" · "+apiDrawsMsg
             :                            apiDrawsMsg;

  return (
    <div style={{background:"linear-gradient(160deg,#020812,#04101e 50%,#030a18)",
      minHeight:"100vh",fontFamily:"'Courier New',monospace",color:"#c0d8f0",
      padding:"14px 14px 56px"}}>

      <style>{`@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:300% 50%}}
               @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
               @keyframes flowIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
               @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
               @keyframes qFlick{0%,100%{opacity:1}50%{opacity:0.55}}
               .bc:hover{transform:scale(1.11)!important;z-index:10!important}
               .ts{animation:flowIn 0.3s ease}`}</style>

      {showHelp && <HelpModal onClose={function(){setShowHelp(false);}}/>}

      {/* Header */}
      <div style={{textAlign:"center",marginBottom:"14px"}}>
        <div style={{fontSize:"clamp(12px,2.8vw,19px)",fontWeight:"900",letterSpacing:"0.17em",textTransform:"uppercase",
          background:"linear-gradient(90deg,#00e5ff,#00e676,#e040fb,#ffab40,#00e5ff)",backgroundSize:"300% 100%",
          WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",animation:"shimmer 5s linear infinite"}}>
          &#9889; MEGA MILLIONS TRI-MODEL + TRACKER &#9889;
        </div>
        <div style={{fontSize:"8px",color:"#6090b8",letterSpacing:"0.15em",marginTop:"4px"}}>
          3 PREDICTION MODELS - {info.total.toLocaleString()} DRAWS - LIVE DATA - {history.length} TRACKED RESULT{history.length!==1?"S":""}
          {info.totalLoaded>0&&<span style={{color:"#00e676"}}> - +{info.totalLoaded} LOADED</span>}
        </div>
        <div style={{display:"flex",justifyContent:"center",gap:"6px",marginTop:"7px",flexWrap:"wrap"}}>
          {[0,1,2].map(function(i){
            return (
              <div key={i} style={{background:TH[MK[i]].bg,border:"1px solid "+TH[MK[i]].br,
                borderRadius:"12px",padding:"3px 10px",textAlign:"center",minWidth:"105px"}}>
                <div style={{fontSize:"8px",color:TH[MK[i]].p,fontWeight:"bold"}}>{ML[i]}</div>
                <div style={{fontSize:"6px",color:"#4878a0",marginTop:"1px"}}>{MS[i]}</div>
              </div>
            );
          })}
          <div onClick={function(){setShowEV(!showEV);}} style={{
            background:TH.tracker.bg,border:"1px solid "+TH.tracker.br,
            borderRadius:"12px",padding:"3px 10px",textAlign:"center",cursor:"pointer",minWidth:"90px"}}>
            <div style={{fontSize:"8px",color:TH.tracker.p,fontWeight:"bold"}}>EV ANALYSIS</div>
            <div style={{fontSize:"6px",color:"#2a1800",marginTop:"1px"}}>$215M jackpot</div>
          </div>
        </div>
        {showEV&&(
          <div style={{...mkPanel("fluid"),maxWidth:"400px",margin:"8px auto 0",animation:"flowIn 0.25s ease",textAlign:"left"}}>
            <span style={mkLbl("#ff6b35")}>Expected Value - $215M Jackpot (Current)</span>
            {[["Lump sum 60%","$129M"],["After tax 63%","$81.3M"],["Odds","1 in 302,575,350"],
              ["EV per $2 ticket","$0.269"],["Net EV","-$1.731"],["Break-even","~$700M jackpot"]
            ].map(function(row){
              return (
                <div key={row[0]} style={{display:"flex",justifyContent:"space-between",padding:"2px 0",borderBottom:"1px solid rgba(0,100,200,0.1)"}}>
                  <span style={{fontSize:"9px",color:"#6898c0"}}>{row[0]}</span>
                  <span style={{fontSize:"9px",color:row[0]==="Net EV"?"#ff6b35":"#82b1ff"}}>{row[1]}</span>
                </div>
              );
            })}
            <div style={{marginTop:"5px",fontSize:"7px",color:"#4a7898",lineHeight:1.7}}>
              At $215M jackpot EV is still negative (-$1.73 per $2 ticket). Still needs ~$700M to break even.
            </div>
          </div>
        )}
        <div style={{fontSize:"7px",color:"#4a7090",marginTop:"5px",letterSpacing:"0.08em"}}>
          ENTERTAINMENT ONLY - INDEPENDENT RANDOM DRAWS - 1-IN-302,575,350 ODDS
        </div>
      </div>

      {/* Tabs */}
      <div style={{display:"flex",gap:"4px",justifyContent:"center",marginBottom:"11px",flexWrap:"wrap",alignItems:"center"}}>
        {[["compare","Compare","fluid"],["fluid",ML[0],"fluid"],["smart",ML[1],"smart"],
          ["quantum",ML[2],"quantum"],["tracker","Tracker","tracker"]].map(function(row){
          var id=row[0],label=row[1],tk=row[2];
          return (
            <button key={id} onClick={function(){setTab(id);}} style={{
              padding:"5px 10px",fontSize:"8px",letterSpacing:"0.1em",textTransform:"uppercase",
              background:tab===id?TH[tk].p+"18":"transparent",
              border:tab===id?"1px solid "+TH[tk].p:"1px solid rgba(0,80,150,0.2)",
              color:tab===id?TH[tk].p:"#6090b8",
              borderRadius:"4px",cursor:"pointer",fontFamily:"inherit",transition:"all 0.2s"}}>
              {id==="tracker"?"&#9679; "+label:label}
            </button>
          );
        })}
        <button onClick={function(){setShowHelp(true);}} title="How to use this app" style={{
          padding:"4px 8px",fontSize:"13px",letterSpacing:0,textTransform:"none",
          background:"rgba(0,80,160,0.2)",border:"1px solid rgba(0,180,255,0.5)",
          color:"#00e5ff",borderRadius:"4px",cursor:"pointer",fontFamily:"inherit",
          lineHeight:1,transition:"all 0.2s"}}>
          &#9432;
        </button>
      </div>

      {/* COMPARE */}
      {tab==="compare"&&(
        <div className="ts">
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"8px",marginBottom:"10px"}}>
            {[0,1,2].map(function(mi){
              var t=TH[MK[mi]],p=preds[mi],sc2=allS[mi];
              var mbScore=allM[mi].filter(function(s){return s.num===p.mega;})[0];
              return (
                <div key={mi} style={{...mkPanel(MK[mi]),textAlign:"center"}}>
                  <div style={{fontSize:"9px",color:t.p,fontWeight:"bold",marginBottom:"2px"}}>{ML[mi]}</div>
                  <div style={{fontSize:"7px",color:"#4878a0",marginBottom:"9px",lineHeight:1.4}}>{MS[mi]}</div>
                  <div style={{display:"flex",justifyContent:"center",gap:"3px",flexWrap:"wrap",marginBottom:"8px"}}>
                    {p.main.map(function(n){
                      var s=sc2.filter(function(x){return x.num===n;})[0];
                      return <BallEl key={n} num={n} mi={mi} size={42} freq={s&&s.freq}/>;
                    })}
                  </div>
                  <div style={{borderTop:"1px solid "+t.br,paddingTop:"6px",marginBottom:"6px"}}>
                    <div style={{fontSize:"6px",color:"#8a5820",marginBottom:"2px"}}>MEGA BALL</div>
                    <BallEl num={p.mega} mi={mi} isMega={true} size={38} freq={mbScore&&mbScore.freq}/>
                  </div>
                  <div style={{fontSize:"8px",color:t.p,fontWeight:"bold",borderTop:"1px solid "+t.br,paddingTop:"5px"}}>
                    {p.main.join(" - ")} + MB{p.mega}
                  </div>
                </div>
              );
            })}
          </div>
          {(function(){
            var cm={};preds.forEach(function(p){p.main.forEach(function(n){cm[n]=(cm[n]||0)+1;});});
            var cons=Object.entries(cm).filter(function(e){return e[1]>=2;}).map(function(e){return{n:+e[0],c:e[1]};}).sort(function(a,b){return b.c-a.c;});
            var mbm={};preds.forEach(function(p){mbm[p.mega]=(mbm[p.mega]||0)+1;});
            var topMB=Object.entries(mbm).sort(function(a,b){return b[1]-a[1];})[0];
            return (
              <div style={{...mkPanel("fluid"),background:"rgba(8,16,36,0.9)",border:"1px solid rgba(255,200,0,0.18)"}}>
                <span style={mkLbl("#ffd600")}>Consensus - Numbers in 2+ Models</span>
                {cons.length===0
                  ?<div style={{fontSize:"9px",color:"#5a88b0",textAlign:"center",padding:"6px 0"}}>Models diverge - no overlapping numbers</div>
                  :<div style={{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center"}}>
                    {cons.map(function(obj){
                      return (
                        <div key={obj.n} style={{textAlign:"center"}}>
                          <div style={{width:"40px",height:"40px",borderRadius:"50%",
                            background:"radial-gradient(circle at 35% 35%,#1a1400,#040408)",
                            border:"2px solid #ffd600",boxShadow:"0 0 12px rgba(255,214,0,0.5)",
                            display:"flex",alignItems:"center",justifyContent:"center",
                            fontSize:"14px",fontWeight:"900",color:"#ffd600",margin:"0 auto"}}>{obj.n}</div>
                          <div style={{fontSize:"7px",color:"#8a6028",marginTop:"2px"}}>{obj.c===3?"ALL 3":"2/3"}</div>
                        </div>
                      );
                    })}
                    {topMB[1]>=2&&(
                      <div style={{textAlign:"center",marginLeft:"8px",borderLeft:"1px solid rgba(255,214,0,0.18)",paddingLeft:"8px"}}>
                        <div style={{fontSize:"6px",color:"#8a5820",marginBottom:"2px"}}>CONSENSUS MB</div>
                        <div style={{width:"40px",height:"40px",borderRadius:"50%",
                          background:"radial-gradient(circle at 35% 35%,#2a1400,#040408)",
                          border:"2px solid #ffd600",boxShadow:"0 0 12px rgba(255,214,0,0.55)",
                          display:"flex",alignItems:"center",justifyContent:"center",
                          fontSize:"14px",fontWeight:"900",color:"#ffd600",margin:"0 auto"}}>{topMB[0]}</div>
                        <div style={{fontSize:"7px",color:"#8a5820",marginTop:"2px"}}>{topMB[1]}/3</div>
                      </div>
                    )}
                  </div>
                }
              </div>
            );
          })()}
        </div>
      )}

      {/* FLUID */}
      {tab==="fluid"&&(
        <div className="ts"><ModelDetail mi={0} scores={fB} mbScores={fM} pred={preds[0]} sel={sel} setSel={setSel}/></div>
      )}
      {/* SMART */}
      {tab==="smart"&&(
        <div className="ts"><SmartDetail scores={sB} mbScores={sM} pred={preds[1]} sel={sel} setSel={setSel}/></div>
      )}
      {/* QUANTUM */}
      {tab==="quantum"&&(
        <div className="ts"><QuantumDetail scores={qB} mbScores={qM} pred={preds[2]} sel={sel} setSel={setSel}/></div>
      )}
      {/* TRACKER */}
      {tab==="tracker"&&(
        <div className="ts">
          <TrackerTab
            currentPreds={preds}
            history={history}
            setHistory={setHistory}
            lastDrawDate={info.lastDrawDate}
            newDrawsFound={info.phase==="new_draws" ? info.newOnRefresh : 0}
          />
        </div>
      )}

      {/* Status bar */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,zIndex:100,
        background:"rgba(1,4,12,0.97)",borderTop:"1px solid rgba(0,120,255,0.1)",
        display:"flex",alignItems:"center",justifyContent:"space-between",
        padding:"5px 14px",flexWrap:"wrap",gap:"5px"}}>
        <div style={{display:"flex",gap:"10px",flexWrap:"wrap",alignItems:"center"}}>
          <div style={{display:"flex",alignItems:"center",gap:"4px"}}>
            <div style={{width:"5px",height:"5px",borderRadius:"50%",background:dotColor,
              boxShadow:"0 0 5px "+dotColor,animation:"pulse 2s ease-in-out infinite"}}/>
            <span style={{fontSize:"7px",color:dotColor,letterSpacing:"0.08em"}}>{dotMsg}</span>
          </div>
          <span style={{fontSize:"7px",color:"#4a7898"}}>LATEST: {info.lastDrawDate}</span>
          <span style={{fontSize:"7px",color:"#4a7898"}}>{info.total.toLocaleString()} DRAWS</span>
          <span style={{fontSize:"6px",color:"#4a7090"}}>
            {window.__mmCache && window.__mmCache.lastDate ? "SYNCED "+window.__mmCache.lastDate+" / " : ""}WINDOW: {recentDraws.length} DRAWS / TICK {tick}
          </span>
        </div>
        <button onClick={function(){doFetch(true);}} disabled={refreshing} style={{
          padding:"4px 14px",fontSize:"7px",letterSpacing:"0.15em",textTransform:"uppercase",fontFamily:"inherit",
          background:refreshing?"rgba(0,50,100,0.1)":"rgba(0,180,255,0.12)",
          border:refreshing?"1px solid rgba(0,80,160,0.2)":"1px solid rgba(0,200,255,0.5)",
          color:refreshing?"#5a88b0":"#00e5ff",
          borderRadius:"4px",cursor:refreshing?"not-allowed":"pointer",
          display:"flex",alignItems:"center",gap:"4px",transition:"all 0.2s"}}>
          <span style={{animation:refreshing?"spin 0.8s linear infinite":"none",display:"inline-block",fontSize:"11px"}}>&#8635;</span>
          {refreshing?"UPDATING...":"REFRESH DRAWS"}
        </button>
      </div>
    </div>
  );
}

// =====================================================================
// MODEL DETAIL TABS (Fluid / Smart / Quantum)

function ModelDetail(props){

function HelpModal(props) {

  var sections = [
    {id:"overview", icon:"🗺", label:"Overview"},
    {id:"fluid",    icon:"⚗",  label:"Fluid Model"},
    {id:"smart",    icon:"🎯",  label:"Smart Play"},
    {id:"quantum",  icon:"⚛",  label:"Quantum"},
    {id:"tracker",  icon:"📊",  label:"Tracker"}
  ];

  var content = {
    overview: {
      title: "How To Use This App",
      color: "#00e5ff",
      blocks: [
        {head:"Getting Started", body:"Open the Compare tab to see all three model predictions side by side. Each model uses a completely different mathematical approach — when two or more models agree on a number, it appears in the Consensus panel."},
        {head:"Tabs", body:"Compare — all 3 predictions + consensus. Fluid / Smart / Quantum — deep-dive into each model with ranked scores, heat maps, and ball-level metrics. Tap any ball in any tab to see its full physics breakdown. Tracker — log actual draw results and measure how each model performs over time."},
        {head:"Refresh Draws", body:"Hit the Refresh Draws button before each drawing night (Tuesday or Friday). It checks the NY Open Data API for new results since the last load, updates the historical frequency data, and recomputes all three models live. The status bar tells you exactly what was found."},
        {head:"Disclaimer", body:"This is entertainment. Mega Millions draws are certified random events — 1-in-302 million jackpot odds. No model can beat a true RNG. The tracker lets you see whether any model is outperforming pure chance, which itself would be statistically remarkable."}
      ]
    },
    fluid: {
      title: "Fluid Dynamics Model",
      color: "#00e5ff",
      blocks: [
        {head:"Core Idea", body:"Treats the pool of 70 balls as a fluid system. Each ball's draw history creates a measurable 'pressure' in the system, and its recency creates 'velocity'. The model finds balls that are energetically primed to appear."},
        {head:"Pressure  P = fᵢ / f̄", body:"Each ball's all-time draw frequency divided by the mean frequency. P > 1 means the ball is drawn more than average (hot). P < 1 means it's drawn less (cold). The model treats this as hydrostatic pressure — high-pressure balls push outward toward selection."},
        {head:"Velocity  v = logistic_overdue(freq, ago)", body:"v = (ago × freq / TOTAL) / (1 + ago × freq / TOTAL). Normalises each ball by its OWN historical frequency. A ball drawn every 10 draws that hasn't appeared in 30 is far more overdue than a rare ball not seen in 30 draws. Logistic form [0,1) gives diminishing returns — when a ball IS drawn, v drops from ~0.87 to ~0.07, allowing the next-ranked ball to enter the top 5. This is what makes picks change after each draw."},
        {head:"Reynolds Number  Re = ρvL/μ", body:"Borrows the fluid turbulence formula. High Re (>4000) = turbulent regime — the ball is in a chaotic, energetic state and due for an event. Low Re = laminar flow — stable, predictable. The color coding in the field view reflects this: red = turbulent, green = neutral, blue = cold."},
        {head:"Bernoulli Energy  B = P + ½ρv²", body:"Total mechanical energy of a ball in the fluid system. Combines both the pressure (historical weight) and kinetic energy (recency momentum). The histogram in the Score Analysis tab shows B across all 70 balls."},
        {head:"NS-Forecast Score  F = 0.38v + 0.30P + 0.18/ω + 0.09f̂ + Δoverdue", body:"The final ensemble score. Weighted sum of velocity, pressure, inverse-vorticity (reward for balls near equilibrium), normalized frequency, and an overdue bonus for balls past 2× their expected return interval. Higher score = stronger prediction."}
      ]
    },
    smart: {
      title: "Smart Play Model",
      color: "#00e676",
      blocks: [
        {head:"Core Idea", body:"Designed around real-world expected value, not just raw frequency. The goal is to maximize payout IF you win — by picking unpopular number combinations that fewer other players choose, avoiding jackpot splits."},
        {head:"Split Avoidance", body:"Most players pick birthdays (1–31), round numbers (10, 20, 30...), and 'lucky' numbers (7, 11, 13, 17). If your ticket matches the jackpot but 40 other people had the same numbers, you split. The model heavily penalizes these overplayed numbers and rewards 'contrarian' picks (32–70, non-round numbers)."},
        {head:"Gap-Spring Energy  E = ½k(ago − T)²", body:"Treats overdue balls like compressed springs. T is the expected return interval (70÷5 = 14 draws for main balls). The longer a ball has been absent beyond its expected interval, the more potential energy it stores. A spring compressed far beyond its natural length must eventually release."},
        {head:"Balance Filter", body:"Real winning combinations almost always satisfy three constraints: sum of the 5 balls between 100–175 (extremely lopsided combos are rare), 2–3 odd and 2–3 even numbers, and 2–3 low (≤35) and 2–3 high (>35) numbers. The balance check bar shows green ticks when your prediction satisfies all three."},
        {head:"EV Analysis", body:"The jackpot needs to reach ~$700M before a $2 ticket has positive expected value (after lump sum, federal tax, and odds). The EV panel in the header shows the current math. Below $700M, every ticket is a guaranteed loss on average — but that's true of most entertainment spending."}
      ]
    },
    quantum: {
      title: "Quantum Entanglement Model",
      color: "#e040fb",
      blocks: [
        {head:"Core Idea", body:"A creative thought experiment: what if lottery balls behaved like quantum particles? This model applies genuine quantum mechanics formulas to number draw history. It's mathematically rigorous (the equations are real physics) but the physical interpretation is purely for fun."},
        {head:"Wave Function  ψ(n) = √(f/N) · e^(iθ)", body:"Each ball has a complex-valued wave function. The amplitude √(f/N) encodes its historical frequency (how 'present' it is in the probability field). The phase e^(iθ) encodes its recency — where it sits in its quantum return cycle. θ = 2π × ago / expectedInterval."},
        {head:"Quantum States", body:"RESONANT — the ball's phase angle produces constructive interference (cos θ > 0.3). It's in phase with its natural return cycle and gains a probability boost. COLLAPSED — just drawn; the wave function has collapsed and probability is suppressed. DESTRUCTIVE — out of phase, destructive interference suppresses probability. SUPERPOSED — neutral state."},
        {head:"Quantum Tunneling", body:"Cold balls (drawn far below expected frequency) can 'tunnel through the probability barrier' — a phenomenon where quantum particles pass through barriers classically forbidden to them. P_tunnel = e^(−κ·barrier). This gives long-shot underdog balls a small but non-zero boost."},
        {head:"Entanglement", body:"The 10 most historically correlated ball pairs (drawn together most often across 3,000+ draws) share quantum entanglement. When one enters a high-probability state, its entangled partner receives a +0.08 amplitude boost in the wave function — mirroring how entangled particles share quantum states across space."}
      ]
    },
    tracker: {
      title: "Draw Tracker",
      color: "#ffab40",
      blocks: [
        {head:"What It Does", body:"Every time Mega Millions draws, log the actual winning numbers here. The tracker stores what each model predicted before that draw and calculates how many main numbers and the Mega Ball each model got right."},
        {head:"Logging a Draw", body:"Tap 'Log Draw Result'. The form pre-fills with the current model predictions — these are what the models would pick right now. If you're logging a past draw, you can manually edit the prediction fields to enter what the model showed before that drawing. Then enter the actual winning numbers and save."},
        {head:"Performance Ratio", body:"The key stat. Expected hits per draw by pure chance = 5 × (5/70) = 0.357. If a model averages 0.8 hits per draw, its ratio is 0.8 ÷ 0.357 = 2.24× — meaning it's hitting 2.24 times more often than random guessing. A ratio consistently above 1.0 across many draws would be genuinely remarkable."},
        {head:"Probability Reference", body:"Getting 3 matches in a single draw happens only 0.165% of the time by chance (1 in 606). Getting 2 matches: 3.46% (1 in 29). The hit distribution bars show how your model's actual distribution compares to the expected random distribution — bars taller than expected mean the model is beating chance for that hit count."},
        {head:"Persistence", body:"All logged draws are saved in your browser's localStorage and persist between sessions. The data stays on your device — nothing is sent anywhere. If you clear browser data, the history is lost, so consider exporting it periodically by copying the JSON from browser devtools → Application → Local Storage."}
      ]
    }
  };

  var sec = content[activeTab];

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:2000,
      display:"flex",alignItems:"center",justifyContent:"center",padding:"16px",
      animation:"flowIn 0.2s ease"}}
      onClick={onClose}>
      <div style={{background:"linear-gradient(160deg,#03101e,#050d1a)",
        border:"1px solid rgba(0,180,255,0.3)",borderRadius:"12px",
        width:"100%",maxWidth:"620px",maxHeight:"88vh",
        display:"flex",flexDirection:"column",overflow:"hidden",
        boxShadow:"0 0 40px rgba(0,100,255,0.2)"}}
        onClick={function(e){e.stopPropagation();}}>

        {/* Modal header */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",
          padding:"14px 18px 10px",borderBottom:"1px solid rgba(0,100,200,0.2)"}}>
          <div style={{fontSize:"clamp(11px,2vw,14px)",fontWeight:"900",letterSpacing:"0.18em",
            textTransform:"uppercase",
            background:"linear-gradient(90deg,#00e5ff,#00e676,#e040fb,#ffab40)",
            backgroundSize:"300% 100%",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",
            animation:"shimmer 4s linear infinite"}}>
            &#9432; Model Guide &amp; Help
          </div>
          <button onClick={onClose} style={{background:"rgba(255,255,255,0.05)",
            border:"1px solid rgba(255,255,255,0.15)",borderRadius:"50%",
            width:"28px",height:"28px",color:"#a0b8d0",fontSize:"14px",
            cursor:"pointer",fontFamily:"inherit",display:"flex",
            alignItems:"center",justifyContent:"center",lineHeight:1}}>&#x2715;</button>
        </div>

        {/* Section tabs */}
        <div style={{display:"flex",gap:"4px",padding:"10px 14px 0",
          borderBottom:"1px solid rgba(0,100,200,0.15)",overflowX:"auto",flexShrink:0}}>
          {sections.map(function(s){
            var active = activeTab === s.id;
            return (
              <button key={s.id} onClick={function(){setActiveTab(s.id);}} style={{
                padding:"5px 10px",fontSize:"8px",letterSpacing:"0.1em",
                textTransform:"uppercase",whiteSpace:"nowrap",fontFamily:"inherit",
                background:active?"rgba(0,180,255,0.15)":"transparent",
                border:active?"1px solid rgba(0,200,255,0.6)":"1px solid transparent",
                color:active?"#00e5ff":"#6898c0",
                borderRadius:"4px 4px 0 0",cursor:"pointer",marginBottom:"-1px",
                borderBottom:active?"1px solid #03101e":"1px solid transparent",
                transition:"all 0.15s"}}>
                {s.icon} {s.label}
              </button>
            );
          })}
        </div>

        {/* Content */}
        <div style={{overflowY:"auto",padding:"16px 18px",flex:1}}>
          <div style={{fontSize:"12px",fontWeight:"900",color:sec.color,
            letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:"14px"}}>
            {sec.title}
          </div>
          {sec.blocks.map(function(block){
            return (
              <div key={block.head} style={{marginBottom:"14px"}}>
                <div style={{fontSize:"9px",fontWeight:"bold",color:sec.color,
                  letterSpacing:"0.15em",textTransform:"uppercase",
                  marginBottom:"5px",
                  borderLeft:"2px solid "+sec.color,paddingLeft:"8px"}}>
                  {block.head}
                </div>
                <div style={{fontSize:"11px",color:"#b0cce8",lineHeight:1.75,
                  paddingLeft:"10px"}}>
                  {block.body}
                </div>
              </div>
            );
          })}
        </div>

        {/* Footer */}
        <div style={{padding:"8px 18px",borderTop:"1px solid rgba(0,100,200,0.15)",
          textAlign:"center",fontSize:"8px",color:"#4a7090",letterSpacing:"0.12em"}}>
          ENTERTAINMENT ONLY &#xb7; INDEPENDENT RANDOM DRAWS &#xb7; 1-IN-302,575,350 ODDS
        </div>
      </div>
    </div>
  );
}

// Mount
var rootEl=ReactDOM.createRoot(document.getElementById("root"));
rootEl.render(React.createElement(App,null));
// Loading screen stays until React mounts and API fetch completes (handled by appStatus)
// Fallback: remove after 8s in case of slow network
setTimeout(function(){var l=document.getElementById("loading");if(l){l.style.opacity="0";setTimeout(function(){l.remove();},400);}},8000);
</script>
</body>
</html>
