// ═══════════════════════════════════════════════════════════════════════════════
// MODEL 1 — NAVIER-STOKES FLUID DYNAMICS
// ═══════════════════════════════════════════════════════════════════════════════
function modelFluid(data, poolSize, ballsPerDraw) {
  const freqs = data.map(d => d[1]);
  const fMean = freqs.reduce((a,b)=>a+b,0)/freqs.length;
  const fMax  = Math.max(...freqs), fMin = Math.min(...freqs);
  const rho=1, mu=0.08, L=poolSize;
  return data.map(([num,freq,ago]) => {
    const P  = freq/fMean;
    const ei = poolSize/ballsPerDraw;
    const v  = Math.min(ei/(ago+1), 3.0);
    const Re = rho*v*L/mu;
    const B  = P + 0.5*rho*v*v;
    const w  = Math.abs(P-1);
    const od = ago>ei*2 ? 0.25*Math.min(ago/(ei*8),0.5) : 0;
    const score = 0.38*v + 0.30*P + 0.18*(1/(w+0.4)) + 0.09*(freq/fMax) + 0.05*((freq-fMin)/(fMax-fMin+1)) + od;
    const regime = Re>4000?"turbulent":Re>2300?"transitional":"laminar";
    return { num, freq, ago, score, P, v, Re, B, w, regime,
             metrics:[["Pressure P",P.toFixed(4)],["Velocity v",v.toFixed(4)],
                      ["Reynolds Re",Math.round(Re)],["Bernoulli B",B.toFixed(4)],
                      ["Vorticity ω",w.toFixed(4)],["NS-Score",score.toFixed(5)]] };
  });
}

// ═══════════════════════════════════════════════════════════════════════════════
// MODEL 2 — SMART PLAY (Split-Avoidance + Gap-Spring + Balance Filter)
// ═══════════════════════════════════════════════════════════════════════════════
function modelSmart(data, poolSize, ballsPerDraw) {
  const freqs = data.map(d=>d[1]);
  const fMean = freqs.reduce((a,b)=>a+b,0)/freqs.length;
  const fMax  = Math.max(...freqs);
  const ei    = poolSize/ballsPerDraw; // expected interval between draws

  // Estimated player popularity — birthday bias (1-31 heavily played), round numbers, etc.
  const popularityWeight = (n) => {
    let w = 1.0;
    if (n <= 31)  w *= 1.85; // birthday bias — hugely overplayed
    if (n <= 12)  w *= 1.20; // month numbers
    if (n % 10 === 0) w *= 1.30; // round numbers
    if ([7,11,13,17,21,23].includes(n)) w *= 1.40; // "lucky" numbers
    return w;
  };

  return data.map(([num,freq,ago]) => {
    // Gap-spring energy: compressed spring potential E = ½k(x-x₀)²
    // Analogy: a spring compressed beyond natural length stores energy & wants to release
    const k          = 1.0; // spring constant
    const naturalGap = ei;
    const compression = Math.max(ago - naturalGap, 0);
    const springE    = 0.5 * k * compression * compression / (ei * ei); // normalized

    // Frequency regression pressure: balls overdue relative to their own draw rate
    const expectedFreq = TOTAL_DRAWS / poolSize * ballsPerDraw;
    const freqDeficit  = Math.max(expectedFreq - freq, 0) / expectedFreq;

    // Split-avoidance: reward unpopular numbers
    const pop    = popularityWeight(num);
    const unpop  = 1 / pop; // high for unpopular numbers

    // Recency balance: slightly penalize balls drawn very recently (just appeared)
    const recencyPenalty = ago < 3 ? 0.15 * (3 - ago) : 0;

    // EV signal contribution (higher jackpot = higher EV weight)
    const evBonus = JACKPOT_M > 700 ? 0.1 : JACKPOT_M > 400 ? 0.05 : 0;

    const score = 0.35*springE + 0.25*unpop + 0.20*freqDeficit
                + 0.15*((freq-Math.min(...freqs))/(fMax-Math.min(...freqs)+1))
                + 0.05*evBonus - recencyPenalty;

    const tag = pop>1.5?"⚠ Overplayed":pop>1.2?"△ Popular":"✓ Contrarian";
    return { num, freq, ago, score, springE, unpop, freqDeficit, pop, tag,
             metrics:[["Spring Energy",springE.toFixed(4)],["Unpopularity",unpop.toFixed(4)],
                      ["Freq Deficit",freqDeficit.toFixed(4)],["Pop Weight",pop.toFixed(2)],
                      ["EV Bonus",evBonus.toFixed(2)],["Smart Score",score.toFixed(5)]] };
  });
}

// ═══════════════════════════════════════════════════════════════════════════════
// MODEL 3 — QUANTUM ENTANGLEMENT THEORY (For Science & Fun)
// Wave function: ψ(n) = √(f/N) · e^(iθ)   where θ = 2π·ago/T
// Probability:  P(n) = |ψ(n)|² after interference, entanglement & tunneling
// ═══════════════════════════════════════════════════════════════════════════════
function modelQuantum(data, poolSize, ballsPerDraw) {
  const freqs = data.map(d=>d[1]);
  const fTotal = freqs.reduce((a,b)=>a+b,0);
  const ei = poolSize/ballsPerDraw;

  // Entanglement map: which numbers share quantum correlation
  const entangleBoost = {};
  ENTANGLED_PAIRS.forEach(([a,b]) => {
    entangleBoost[a] = (entangleBoost[a]||0) + 0.08;
    entangleBoost[b] = (entangleBoost[b]||0) + 0.08;
  });

  return data.map(([num,freq,ago]) => {
    // Wave function amplitude |ψ| = √(freq/total_appearances)
    const amplitude = Math.sqrt(freq / fTotal);

    // Phase angle: θ = 2π × (ago / expectedInterval)
    // When ago ≈ expectedInterval → θ ≈ 2π → constructive resonance
    const theta = (2 * Math.PI * ago) / ei;

    // Real and imaginary parts of ψ
    const psiReal = amplitude * Math.cos(theta);
    const psiImag = amplitude * Math.sin(theta);

    // Probability density BEFORE interference: |ψ|²
    const probRaw = psiReal*psiReal + psiImag*psiImag;

    // Interference term: constructive if cos(θ) > 0, destructive if < 0
    // Numbers "in phase" with their natural return cycle interfere constructively
    const interference = Math.cos(theta); // +1 = constructive, -1 = destructive

    // Quantum tunneling: cold numbers can tunnel through the "probability barrier"
    // P_tunnel = e^(-κ·barrier) where barrier = how far below expected freq
    const expectedF   = fTotal / poolSize;
    const barrier     = Math.max(expectedF - freq, 0) / expectedF;
    const kappa       = 1.8; // tunneling decay constant
    const tunneling   = Math.exp(-kappa * barrier) * 0.12;

    // Decoherence: recently drawn balls have "collapsed" — less superposition
    const decoherence = ago < 4 ? Math.exp(-(4-ago)*0.4) : 1.0;

    // Entanglement boost from correlated pair partners
    const entanglement = entangleBoost[num] || 0;

    // Schrödinger energy eigenvalue: E = ½ℏω² (kinetic) + V (potential well)
    // Map to: kinetic = amplitude²/2, potential = 1/(ago+1)
    const hbar   = 0.5; // reduced Planck analog
    const omega  = 2*Math.PI/ei;
    const Ekin   = 0.5 * hbar * omega * omega * amplitude * amplitude;
    const Epot   = 1/(ago+1);
    const Etotal = Ekin + Epot;

    // Final quantum probability score
    const score = (probRaw * (1 + interference * 0.5) + tunneling + entanglement)
                * decoherence + 0.15 * Etotal;

    const state = ago < 4 ? "COLLAPSED" : interference > 0.3 ? "RESONANT"
                : interference < -0.3 ? "DESTRUCTIVE" : "SUPERPOSED";
    return { num, freq, ago, score, amplitude, theta, probRaw, interference,
             tunneling, decoherence, entanglement, Etotal, state,
             metrics:[["Amplitude |ψ|",amplitude.toFixed(5)],
                      ["Phase θ (rad)",(theta%(2*Math.PI)).toFixed(4)],
                      ["Interference",interference.toFixed(4)],
                      ["Tunneling",tunneling.toFixed(4)],
                      ["Decoherence",decoherence.toFixed(4)],
                      ["QE Score",score.toFixed(5)]] };
  });
}

// ═══════════════════════════════════════════════════════════════════════════════
// BALANCE FILTER — applied to combo selection for Model 2
// ═══════════════════════════════════════════════════════════════════════════════
function applyBalanceFilter(candidates) {
  // Pick top N candidates and find the best 5-ball combo by balance score
  const pool = candidates.slice(0, 20);
  let best = null, bestBalance = -Infinity;
  // Try combinations from top 12
  const top12 = pool.slice(0,12).map(s=>s.num);
  for (let a=0;a<top12.length;a++)
  for (let b=a+1;b<top12.length;b++)
  for (let c=b+1;c<top12.length;c++)
  for (let d=c+1;d<top12.length;d++)
  for (let e=d+1;e<top12.length;e++) {
    const combo = [top12[a],top12[b],top12[c],top12[d],top12[e]];
    const sum   = combo.reduce((x,y)=>x+y,0);
    const odds  = combo.filter(n=>n%2!==0).length;
    const lows  = combo.filter(n=>n<=35).length;
    // Ideal: sum 100-175, 2-3 odd, 2-3 low
    const sumOK  = sum>=100 && sum<=175 ? 1 : 0;
    const oddOK  = odds>=2 && odds<=3  ? 1 : 0;
    const lowOK  = lows>=2 && lows<=3  ? 1 : 0;
    const totalS = pool.filter(s=>combo.includes(s.num)).reduce((x,s)=>x+s.score,0);
    const balance = sumOK*2 + oddOK*1.5 + lowOK*1.5 + totalS*0.5;
    if (balance > bestBalance) { bestBalance=balance; best=combo; }
  }
  return best ? best.sort((a,b)=>a-b) : candidates.slice(0,5).map(s=>s.num).sort((a,b)=>a-b);
}

  const t = THEME[MODEL_THEMES[modelIdx]];
  const sorted = [...scores].sort((a,b)=>b.score-a.score);
  const maxS = sorted[0].score;
  const predSet = new Set(prediction.main);
  const detailBall = selectedBall?.modelIdx===modelIdx
    ? scores.find(s=>s.num===selectedBall.num) : null;

  return (
    <>
      <div style={{...S.panel(MODEL_THEMES[modelIdx]),textAlign:"center",marginBottom:"10px"}}>
        <span style={S.label(t.primary)}>· {title} ·</span>
        <div style={{fontSize:"8px",color:"#1e4060",marginBottom:"16px",maxWidth:"600px",margin:"0 auto 16px",lineHeight:1.8}}>{desc}</div>

        {/* Balls */}
        <div style={{display:"flex",justifyContent:"center",gap:"14px",flexWrap:"wrap",marginBottom:"16px",alignItems:"flex-end"}}>
          {prediction.main.map((n,i)=>{
            const s=scores.find(x=>x.num===n);
            return <Ball key={n} num={n} modelIdx={modelIdx} size={66}
              showRank rank={sorted.findIndex(x=>x.num===n)+1} freq={s?.freq}/>;
          })}
          <div style={{borderLeft:`1px solid ${t.border}`,paddingLeft:"14px",marginLeft:"4px"}}>
            <div style={{fontSize:"7px",color:"#3a2000",marginBottom:"4px"}}>MEGA BALL</div>
            <Ball num={prediction.mega} modelIdx={modelIdx} isMega size={66}
              freq={mbScores.find(s=>s.num===prediction.mega)?.freq}/>
          </div>
        </div>
        <div style={{fontSize:"11px",color:t.primary,letterSpacing:"0.15em",fontWeight:"bold"}}>
          {prediction.main.join("  ·  ")} + MB {prediction.mega}
        </div>
      </div>

      {/* Top 15 bar chart */}
      <div style={S.panel(MODEL_THEMES[modelIdx])}>
        <span style={S.label(t.secondary)}>· Top 15 by Score · Click any ball above for details ·</span>
        {sorted.slice(0,15).map((s,i)=>{
          const pct=(s.score/maxS)*100;
          return (
            <div key={s.num} onClick={()=>setSelectedBall({modelIdx,num:s.num})}
              style={{marginBottom:"5px",display:"flex",alignItems:"center",gap:"7px",cursor:"pointer"}}>
              <div style={{width:"18px",fontSize:"7px",color:"#1e4060",textAlign:"right"}}>#{i+1}</div>
              <div style={{width:"22px",fontSize:"10px",color:predSet.has(s.num)?"#fff":t.primary,
                fontWeight:"bold",textAlign:"center"}}>{s.num}</div>
              <div style={{flex:1,height:"6px",background:"rgba(0,20,50,0.8)",borderRadius:"3px",overflow:"hidden"}}>
                <div style={{height:"100%",width:`${pct}%`,
                  background:`linear-gradient(90deg,${t.primary}55,${t.primary})`,borderRadius:"3px"}}/>
              </div>
              <div style={{width:"44px",fontSize:"8px",color:"#2a5070",textAlign:"right"}}>
                {s.score.toFixed(3)}</div>
              <div style={{width:"8px",fontSize:"8px",textAlign:"center",color:"#ffd600"}}>
                {predSet.has(s.num)?"★":""}</div>
            </div>
          );
        })}
      </div>

      {/* Detail card for selected ball */}
      {detailBall && (
        <div style={{...S.panel(MODEL_THEMES[modelIdx]),animation:"flowIn 0.25s ease"}}>
          <span style={S.label(t.primary)}>· Ball {detailBall.num} · Full Metrics ·</span>
          <div style={{display:"flex",flexWrap:"wrap",gap:"20px"}}>
            <div style={{textAlign:"center",minWidth:"70px"}}>
              <div style={{fontSize:"32px",fontWeight:"900",color:t.primary}}>{detailBall.num}</div>
              <div style={{fontSize:"7px",color:"#1e4060"}}>{detailBall.freq} draws</div>
              {detailBall.regime&&<div style={{fontSize:"7px",color:detailBall.regime==="turbulent"?"#ff3333":detailBall.regime==="transitional"?"#ff8c00":"#00e676",
                marginTop:"2px",letterSpacing:"0.1em"}}>{detailBall.regime?.toUpperCase()}</div>}
              {detailBall.state&&<div style={{fontSize:"7px",color:t.primary,marginTop:"2px",
                letterSpacing:"0.1em"}}>{detailBall.state}</div>}
            </div>
            <div style={{flex:1,display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px 20px"}}>
              {detailBall.metrics?.map(([k,v])=>(
                <div key={k}>
                  <div style={{fontSize:"7px",color:"#1e4060",letterSpacing:"0.15em"}}>{k.toUpperCase()}</div>

        </div>
      )}

  );

// ─── SMART MODEL VIEW ─────────────────────────────────────────────────────────
function SmartModelView({scores,mbScores,prediction,S,Ball,selectedBall,setSelectedBall}) {
  const t = THEME.smart;
  const sorted = [...scores].sort((a,b)=>b.score-a.score);
  const maxS = sorted[0].score;
  const predSet = new Set(prediction.main);
  const detailBall = selectedBall?.modelIdx===1
    ? scores.find(s=>s.num===selectedBall.num) : null;

  // Balance check on selected combo
  const comboSum  = prediction.main.reduce((a,b)=>a+b,0);
  const comboOdds = prediction.main.filter(n=>n%2!==0).length;
  const comboLows = prediction.main.filter(n=>n<=35).length;
  const sumOK = comboSum>=100&&comboSum<=175, oddOK=comboOdds>=2&&comboOdds<=3, lowOK=comboLows>=2&&comboLows<=3;

  return (
    <>
      <div style={{...S.panel("smart"),textAlign:"center"}}>
        <span style={S.label(t.primary)}>· Smart Play Model · Spring Pressure + Split Avoidance + Balance Filter ·</span>

        <div style={{display:"flex",justifyContent:"center",gap:"14px",flexWrap:"wrap",marginBottom:"16px",alignItems:"flex-end"}}>
          {prediction.main.map(n=>{
            const s=scores.find(x=>x.num===n);
            return (
              <div key={n} style={{textAlign:"center"}}>
                <Ball num={n} modelIdx={1} size={66}
                  showRank rank={sorted.findIndex(x=>x.num===n)+1} freq={s?.freq}/>
                <div style={{fontSize:"7px",marginTop:"3px",
                  color:s?.pop>1.5?"#ff6b35":s?.pop>1.2?"#ffb347":"#00e676"}}>
                  {s?.tag}
                </div>
              </div>
            );
          })}
          <div style={{borderLeft:`1px solid ${t.border}`,paddingLeft:"14px",marginLeft:"4px"}}>
            <div style={{fontSize:"7px",color:"#3a2000",marginBottom:"4px"}}>MEGA BALL</div>
            <Ball num={prediction.mega} modelIdx={1} isMega size={66}
              freq={mbScores.find(s=>s.num===prediction.mega)?.freq}/>
          </div>
        </div>

        {/* Balance check */}
        <div style={{display:"inline-flex",gap:"12px",background:"rgba(0,30,15,0.6)",
          border:"1px solid rgba(0,200,100,0.2)",borderRadius:"8px",padding:"8px 16px",
          flexWrap:"wrap",justifyContent:"center",marginBottom:"10px"}}>
          <span style={{fontSize:"7px",color:"#1e4060",letterSpacing:"0.1em",alignSelf:"center"}}>
            BALANCE CHECK
          </span>
          {[
            [`Sum: ${comboSum}`,sumOK,"100-175"],
            [`Odd/Even: ${comboOdds}/${5-comboOdds}`,oddOK,"2-3 odd"],
            [`Low/High: ${comboLows}/${5-comboLows}`,lowOK,"2-3 low (≤35)"],
          ].map(([label,pass,rule])=>(
            <div key={label} style={{textAlign:"center"}}>
              <div style={{fontSize:"9px",color:pass?"#00e676":"#ff6b35",fontWeight:"bold"}}>{label}</div>
              <div style={{fontSize:"6px",color:"#1e4060"}}>{pass?"✓":rule}</div>
            </div>
          ))}
        </div>

        <div style={{fontSize:"11px",color:t.primary,letterSpacing:"0.15em",fontWeight:"bold"}}>
          {prediction.main.join("  ·  ")} + MB {prediction.mega}
        </div>
      </div>

      {/* Split avoidance heatmap */}
      <div style={S.panel("smart")}>
        <span style={S.label(t.secondary)}>· Player Popularity Bias · Red = Overplayed · Avoid these ·</span>
        <div style={{display:"grid",gridTemplateColumns:"repeat(10,1fr)",gap:"3px",marginBottom:"8px"}}>
          {scores.map(s=>{
            const pop  = s.pop;
            const isP  = predSet.has(s.num);
            const bgColor = pop>1.8?"rgba(80,10,0,0.7)":pop>1.4?"rgba(60,20,0,0.7)":pop>1.1?"rgba(20,40,0,0.7)":"rgba(0,40,20,0.7)";
            const border  = pop>1.8?"#ff3333":pop>1.4?"#ff8c00":pop>1.1?"#ffb347":"#00e676";
            return (
              <div key={s.num} onClick={()=>setSelectedBall({modelIdx:1,num:s.num})}
                style={{background:bgColor,border:`1px solid ${isP?"#fff":border}44`,
                  borderRadius:"4px",padding:"4px 1px",textAlign:"center",cursor:"pointer",
                  position:"relative"}}>
                <div style={{fontSize:"clamp(8px,1.2vw,11px)",color:isP?"#fff":border,
                  fontWeight:isP?"bold":"normal"}}>{s.num}</div>
                <div style={{fontSize:"6px",color:"#1e4060",marginTop:"1px"}}>{s.pop.toFixed(1)}×</div>
                {isP&&<div style={{position:"absolute",top:"-2px",right:"-2px",width:"5px",height:"5px",
                  borderRadius:"50%",background:"#fff",animation:"pulse 1.5s ease-in-out infinite"}}/>}
              </div>
            );
          })}
        </div>
        <div style={{display:"flex",gap:"12px",flexWrap:"wrap",justifyContent:"center"}}>
          {[["#ff3333","Pop >1.8× (avoid)"],["#ff8c00","Pop >1.4×"],["#ffb347","Pop >1.1×"],["#00e676","Contrarian ✓"]].map(([c,l])=>(
            <div key={l} style={{display:"flex",alignItems:"center",gap:"3px"}}>
              <div style={{width:"8px",height:"8px",borderRadius:"50%",background:c}}/>
              <span style={{fontSize:"7px",color:"#2a5070"}}>{l}</span>
            </div>
          ))}
        </div>
      </div>

      {/* Top 15 */}
      <div style={S.panel("smart")}>
        <span style={S.label(t.secondary)}>· Top 15 by Smart Score ·</span>
        {sorted.slice(0,15).map((s,i)=>{
          const pct=(s.score/maxS)*100;
          return (
            <div key={s.num} onClick={()=>setSelectedBall({modelIdx:1,num:s.num})}
              style={{marginBottom:"5px",display:"flex",alignItems:"center",gap:"6px",cursor:"pointer"}}>
              <div style={{width:"16px",fontSize:"7px",color:"#1e4060",textAlign:"right"}}>#{i+1}</div>
              <div style={{width:"22px",fontSize:"10px",fontWeight:"bold",textAlign:"center",
                color:predSet.has(s.num)?"#fff":t.primary}}>{s.num}</div>
              <div style={{flex:1,height:"6px",background:"rgba(0,20,10,0.8)",borderRadius:"3px",overflow:"hidden"}}>
                <div style={{height:"100%",width:`${pct}%`,
                  background:`linear-gradient(90deg,${t.primary}55,${t.primary})`,borderRadius:"3px"}}/>
              </div>
              <div style={{width:"50px",fontSize:"7px",color:"#1e4060",textAlign:"right"}}>
                sp:{s.springE.toFixed(2)}</div>
              <div style={{width:"44px",fontSize:"8px",color:"#2a5070",textAlign:"right"}}>
                {s.score.toFixed(3)}</div>
              <div style={{width:"8px",fontSize:"8px",color:"#ffd600"}}>
                {predSet.has(s.num)?"★":""}</div>
            </div>
          );
        })}
      </div>

      {detailBall && (
        <div style={{...S.panel("smart"),animation:"flowIn 0.25s ease"}}>
          <span style={S.label(t.primary)}>· Ball {detailBall.num} · Smart Play Metrics ·</span>
          <div style={{display:"flex",flexWrap:"wrap",gap:"20px"}}>
            <div style={{textAlign:"center",minWidth:"70px"}}>
              <div style={{fontSize:"32px",fontWeight:"900",color:t.primary}}>{detailBall.num}</div>
              <div style={{fontSize:"7px",color:"#1e4060"}}>{detailBall.freq} draws</div>
              <div style={{fontSize:"7px",marginTop:"2px",
                color:detailBall.pop>1.5?"#ff6b35":detailBall.pop>1.2?"#ffb347":"#00e676"}}>
                {detailBall.tag}
              </div>
            </div>
            <div style={{flex:1,display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px 20px"}}>
              {detailBall.metrics?.map(([k,v])=>(
                <div key={k}>
                  <div style={{fontSize:"7px",color:"#1e4060",letterSpacing:"0.12em"}}>{k.toUpperCase()}</div>
                  <div style={{fontSize:"12px",color:t.primary}}>{v}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </>
  );
}

// ─── QUANTUM MODEL VIEW ───────────────────────────────────────────────────────
function QuantumModelView({scores,mbScores,prediction,S,Ball,selectedBall,setSelectedBall}) {
  const t = THEME.quantum;
  const sorted = [...scores].sort((a,b)=>b.score-a.score);
  const maxS = sorted[0].score;
  const predSet = new Set(prediction.main);
  const detailBall = selectedBall?.modelIdx===2
    ? scores.find(s=>s.num===selectedBall.num) : null;

  const stateColor = (state) =>
    state==="RESONANT"?"#e040fb":state==="COLLAPSED"?"#ff3333":
    state==="DESTRUCTIVE"?"#448aff":"#a78bfa";

  return (
    <>
      <div style={{...S.panel("quantum"),textAlign:"center"}}>
        <span style={S.label(t.primary)}>· Quantum Entanglement Model · For Science & Fun ·</span>
        <div style={{fontSize:"8px",color:"#2a1040",marginBottom:"16px",lineHeight:2.0,
          maxWidth:"640px",margin:"0 auto 16px",fontStyle:"italic"}}>
          <span style={{color:"#e040fb"}}>ψ(n) = √(f/N) · e^(iθ)</span>
          {"  "}where θ = 2π·ago/T
          {"  "}·{"  "}
          <span style={{color:"#a78bfa"}}>P(n) = |ψ|² · interference + tunneling + entanglement</span>
        </div>

        <div style={{display:"flex",justifyContent:"center",gap:"14px",flexWrap:"wrap",marginBottom:"16px",alignItems:"flex-end"}}>
          {prediction.main.map(n=>{
            const s=scores.find(x=>x.num===n);
            return (
              <div key={n} style={{textAlign:"center"}}>
                <Ball num={n} modelIdx={2} size={66}
                  showRank rank={sorted.findIndex(x=>x.num===n)+1} freq={s?.freq}/>
                <div style={{fontSize:"7px",color:stateColor(s?.state),marginTop:"3px",
                  letterSpacing:"0.08em",animation:s?.state==="RESONANT"?"quantumFlicker 3s ease-in-out infinite":"none"}}>
                  {s?.state}
                </div>
              </div>
            );
          })}
          <div style={{borderLeft:`1px solid ${t.border}`,paddingLeft:"14px",marginLeft:"4px"}}>
            <div style={{fontSize:"7px",color:"#3a2000",marginBottom:"4px"}}>MEGA BALL</div>
            <Ball num={prediction.mega} modelIdx={2} isMega size={66}
              freq={mbScores.find(s=>s.num===prediction.mega)?.freq}/>
          </div>
        </div>
        <div style={{fontSize:"11px",color:t.primary,letterSpacing:"0.15em",fontWeight:"bold"}}>
          {prediction.main.join("  ·  ")} + MB {prediction.mega}
        </div>
      </div>

      {/* Quantum state field */}
      <div style={S.panel("quantum")}>
        <span style={S.label(t.secondary)}>· Quantum State Field · Ball Superposition Visualization ·</span>
        <div style={{display:"grid",gridTemplateColumns:"repeat(10,1fr)",gap:"3px",marginBottom:"8px"}}>
          {scores.map(s=>{
            const isP  = predSet.has(s.num);
            const sc   = stateColor(s.state);
            const alpha = Math.min(s.score/maxS*1.4,1);
            return (
              <div key={s.num} onClick={()=>setSelectedBall({modelIdx:2,num:s.num})}
                style={{background:`rgba(30,0,50,${alpha*0.6})`,
                  border:`1px solid ${isP?"#fff":sc}${isP?"":"44"}`,
                  borderRadius:"4px",padding:"4px 1px",textAlign:"center",cursor:"pointer",
                  position:"relative",
                  boxShadow:isP?`0 0 10px ${t.glow}`:s.state==="RESONANT"?`0 0 6px ${t.glow}60`:"none",
                  animation:s.state==="RESONANT"?"quantumFlicker 3s ease-in-out infinite":"none"}}>
                <div style={{fontSize:"clamp(8px,1.2vw,11px)",color:isP?"#fff":sc,
                  fontWeight:isP?"bold":"normal"}}>{s.num}</div>
                <div style={{fontSize:"6px",color:"#2a1040",marginTop:"1px"}}>
                  {s.state==="RESONANT"?"~":s.state==="COLLAPSED"?"×":s.state==="DESTRUCTIVE"?"↓":"○"}
                </div>
                {isP&&<div style={{position:"absolute",top:"-2px",right:"-2px",width:"5px",height:"5px",
                  borderRadius:"50%",background:"#fff",animation:"pulse 1.5s ease-in-out infinite"}}/>}
              </div>
            );
          })}
        </div>
        <div style={{display:"flex",gap:"12px",flexWrap:"wrap",justifyContent:"center"}}>
          {[["#e040fb","~ RESONANT (constructive)"],["#ff3333","× COLLAPSED (just drawn)"],
            ["#448aff","↓ DESTRUCTIVE (out-of-phase)"],["#a78bfa","○ SUPERPOSED"]].map(([c,l])=>(
            <div key={l} style={{display:"flex",alignItems:"center",gap:"3px"}}>
              <div style={{width:"8px",height:"8px",borderRadius:"50%",background:c}}/>
              <span style={{fontSize:"7px",color:"#3a2070"}}>{l}</span>
            </div>
          ))}
        </div>
      </div>

      {/* Entangled pairs */}
      <div style={S.panel("quantum")}>
        <span style={S.label(t.secondary)}>· Quantum Entangled Pairs · Most Correlated All-Time ·</span>
        <div style={{display:"flex",flexWrap:"wrap",gap:"8px"}}>
          {ENTANGLED_PAIRS.map(([a,b])=>(
            <div key={`${a}-${b}`} style={{display:"flex",alignItems:"center",gap:"4px",
              background:"rgba(30,0,60,0.6)",border:"1px solid rgba(200,50,255,0.2)",
              borderRadius:"20px",padding:"4px 10px"}}>
              <span style={{fontSize:"11px",fontWeight:"bold",color:t.primary}}>{a}</span>
              <span style={{fontSize:"8px",color:"#3a1060"}}>⟷</span>
              <span style={{fontSize:"11px",fontWeight:"bold",color:t.primary}}>{b}</span>
            </div>
          ))}
        </div>
        <div style={{fontSize:"8px",color:"#1a1030",marginTop:"8px",lineHeight:1.7}}>
          Entangled balls share quantum correlation — when one enters superposition, its partner
          receives an amplitude boost of +0.08 in the wave function calculation.
        </div>
      </div>

      {/* Top 15 */}
      <div style={S.panel("quantum")}>
        <span style={S.label(t.secondary)}>· Top 15 by Quantum Score ·</span>
        {sorted.slice(0,15).map((s,i)=>{
          const pct=(s.score/maxS)*100;
          const sc=stateColor(s.state);
          return (
            <div key={s.num} onClick={()=>setSelectedBall({modelIdx:2,num:s.num})}
              style={{marginBottom:"5px",display:"flex",alignItems:"center",gap:"6px",cursor:"pointer"}}>
              <div style={{width:"16px",fontSize:"7px",color:"#1e1040",textAlign:"right"}}>#{i+1}</div>
              <div style={{width:"22px",fontSize:"10px",fontWeight:"bold",textAlign:"center",
                color:predSet.has(s.num)?"#fff":t.primary}}>{s.num}</div>
              <div style={{flex:1,height:"6px",background:"rgba(20,0,40,0.8)",borderRadius:"3px",overflow:"hidden"}}>
                <div style={{height:"100%",width:`${pct}%`,
                  background:`linear-gradient(90deg,${t.primary}55,${t.primary})`,borderRadius:"3px"}}/>
              </div>
              <div style={{width:"60px",fontSize:"7px",color:sc,textAlign:"right",letterSpacing:"0.05em"}}>
                {s.state}</div>
              <div style={{width:"44px",fontSize:"8px",color:"#3a2070",textAlign:"right"}}>
                {s.score.toFixed(3)}</div>
              <div style={{width:"8px",fontSize:"8px",color:"#ffd600"}}>
                {predSet.has(s.num)?"★":""}</div>
            </div>
          );
        })}
      </div>

      {detailBall && (
        <div style={{...S.panel("quantum"),animation:"flowIn 0.25s ease"}}>
          <span style={S.label(t.primary)}>· Ball {detailBall.num} · Quantum State Metrics ·</span>
          <div style={{display:"flex",flexWrap:"wrap",gap:"20px"}}>
            <div style={{textAlign:"center",minWidth:"70px"}}>
              <div style={{fontSize:"32px",fontWeight:"900",color:t.primary}}>{detailBall.num}</div>
              <div style={{fontSize:"7px",color:"#1e1040"}}>{detailBall.freq} draws</div>
              <div style={{fontSize:"7px",color:stateColor(detailBall.state),marginTop:"3px",
                letterSpacing:"0.1em"}}>{detailBall.state}</div>
              {detailBall.entanglement>0&&
                <div style={{fontSize:"7px",color:t.primary,marginTop:"2px"}}>⟷ ENTANGLED</div>}
            </div>
            <div style={{flex:1,display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px 20px"}}>
              {detailBall.metrics?.map(([k,v])=>(
                <div key={k}>
                  <div style={{fontSize:"7px",color:"#1e1040",letterSpacing:"0.12em"}}>{k.toUpperCase()}</div>
                  <div style={{fontSize:"12px",color:t.primary}}>{v}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </>
  );
}

    // Mount app and hide loading screen
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TriModelPredictor />);
    setTimeout(() => {
      const l = document.getElementById('loading');
      if (l) { l.style.opacity = '0'; setTimeout(() => l.remove(), 500); }
    }, 800);
  </script>
</body>
</html>
