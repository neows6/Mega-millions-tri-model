<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;

const BASE_BALL_DATA = [
  [1,242,1],[2,267,29],[3,258,5],[4,268,9],[5,258,5],[6,251,13],[7,246,1],
  [8,253,15],[9,238,31],[10,281,39],[11,270,11],[12,248,17],[13,250,9],

  [20,274,11],[21,250,3],[22,265,5],[23,226,45],[24,268,3],[25,255,21],
  [26,249,15],[27,255,9],[28,253,9],[29,269,77],[30,245,13],[31,288,7],
  [32,252,1],[33,237,5],[34,222,21],[35,258,1],[36,246,1],[37,241,5],
  [38,271,3],[39,267,17],[40,255,1],[41,233,9],[42,268,5],[43,242,1],
  [44,253,3],[45,236,7],[46,272,37],[47,236,27],[48,265,19],[49,233,3],
  [50,247,11],[51,210,11],[52,206,9],[53,180,9],[54,155,15],[55,140,11],
  [56,169,1],[57,89,3],[58,104,1],[59,89,21],[60,76,7],[61,81,51],

];

const BASE_MEGA_DATA = [
  [1,117,21],[2,100,5],[3,117,81],[4,108,11],[5,85,25],[6,105,5],
  [7,113,1],[8,97,3],[9,116,13],[10,110,9],[11,100,77],[12,98,1],
  [13,103,25],[14,91,19],[15,107,7],[16,69,9],[17,81,7],[18,80,37],
  [19,82,23],[20,76,87],[21,83,23],[22,89,65],[23,61,17],[24,95,11]
];

const ENTANGLED_PAIRS = [[18,31],[29,32],[17,21],[8,10],[16,36],[4,34],[6,26],[10,40],[14,46],[31,46]];
const BASE_DRAWS    = 3019;
const BASELINE_DATE = "2026-04-24";
const API_URL       = "https://data.ny.gov/resource/5xaw-6ayf.json";

async function fetchNewDrawings() {
  const url = API_URL + "?$order=draw_date%20DESC&$limit=200";
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  return data
    .filter(function(d){ return (d.draw_date || "").substring(0,10) > BASELINE_DATE; })
    .sort(function(a,b){ return a.draw_date.localeCompare(b.draw_date); });
}

function mergeDrawings(newDraws) {
  var bm = {};
  BASE_BALL_DATA.forEach(function(row){ bm[row[0]] = [row[0],row[1],row[2]]; });
  var mm = {};
  BASE_MEGA_DATA.forEach(function(row){ mm[row[0]] = [row[0],row[1],row[2]]; });
  var total = newDraws.length;
  newDraws.forEach(function(d, idx) {
    var balls = (d.winning_numbers||"").trim().split(/\s+/).map(Number).filter(function(n){return n>=1&&n<=70;});
    var mega  = parseInt(d.mega_ball||"0", 10);
    var ago   = total - idx;
    balls.forEach(function(n){ if(bm[n]){bm[n][1]+=1;bm[n][2]=ago;} });
    if(mm[mega]){mm[mega][1]+=1;mm[mega][2]=ago;}
  });
  if(total > 0){
    var last = newDraws[total-1];
    var lb   = (last.winning_numbers||"").trim().split(/\s+/).map(Number);
    var lm   = parseInt(last.mega_ball||"0",10);
    lb.forEach(function(n){ if(bm[n]) bm[n][2]=1; });
    if(mm[lm]) mm[lm][2]=1;
  }
  return { balls: Object.values(bm), mega: Object.values(mm) };
}

function modelFluid(data, pool, bpd) {
  var freqs = data.map(function(d){return d[1];});
  var fMean = freqs.reduce(function(a,b){return a+b;},0)/freqs.length;
  var fMax  = Math.max.apply(null,freqs);
  var fMin  = Math.min.apply(null,freqs);
  return data.map(function(row){
    var num=row[0],freq=row[1],ago=row[2];
    var P=freq/fMean, ei=pool/bpd, v=Math.min(ei/(ago+1),3.0);
    var Re=(v*pool)/0.08, B=P+0.5*v*v, w=Math.abs(P-1);
    var od=ago>ei*2?0.25*Math.min(ago/(ei*8),0.5):0;
    var score=0.38*v+0.30*P+0.18*(1/(w+0.4))+0.09*(freq/fMax)+0.05*((freq-fMin)/(fMax-fMin+1))+od;
    return {num:num,freq:freq,ago:ago,score:score,P:P,v:v,Re:Re,B:B,w:w,
      regime:Re>4000?"turbulent":Re>2300?"transitional":"laminar",
      metrics:[["Pressure P",P.toFixed(4)],["Velocity v",v.toFixed(4)],["Reynolds",Math.round(Re)],
               ["Bernoulli B",B.toFixed(4)],["Vorticity w",w.toFixed(4)],["NS-Score",score.toFixed(5)]]};
  });
}

function modelSmart(data, pool, bpd, totalDraws) {
  var freqs = data.map(function(d){return d[1];});
  var fMax  = Math.max.apply(null,freqs);
  var fMin  = Math.min.apply(null,freqs);
  var ei    = pool/bpd;
  function popW(n){
    var w=1;
    if(n<=31) w*=1.85; if(n<=12) w*=1.20;
    if(n%10===0) w*=1.30;
    if([7,11,13,17,21,23].indexOf(n)>=0) w*=1.40;
    return w;
  }
  return data.map(function(row){
    var num=row[0],freq=row[1],ago=row[2];
    var comp=Math.max(ago-ei,0), springE=0.5*comp*comp/(ei*ei);
    var expF=totalDraws/pool*bpd, freqDef=Math.max(expF-freq,0)/expF;
    var pop=popW(num), unpop=1/pop, recPen=ago<3?0.15*(3-ago):0;
    var score=0.35*springE+0.25*unpop+0.20*freqDef+0.15*((freq-fMin)/(fMax-fMin+1))-recPen;
    return {num:num,freq:freq,ago:ago,score:score,springE:springE,unpop:unpop,freqDef:freqDef,pop:pop,
      tag:pop>1.5?"Overplayed":pop>1.2?"Popular":"Contrarian",
      metrics:[["Spring E",springE.toFixed(4)],["Unpopularity",unpop.toFixed(4)],
               ["Freq Deficit",freqDef.toFixed(4)],["Pop Weight",pop.toFixed(2)],
               ["Smart Score",score.toFixed(5)]]};
  });
}

function modelQuantum(data, pool, bpd) {
  var freqs  = data.map(function(d){return d[1];});
  var fTotal = freqs.reduce(function(a,b){return a+b;},0);
  var ei     = pool/bpd;
  var eB     = {};
  ENTANGLED_PAIRS.forEach(function(pair){
    var a=pair[0],b=pair[1];
    eB[a]=(eB[a]||0)+0.08; eB[b]=(eB[b]||0)+0.08;
  });
  return data.map(function(row){
    var num=row[0],freq=row[1],ago=row[2];
    var amp=Math.sqrt(freq/fTotal), theta=(2*Math.PI*ago)/ei;
    var pR=amp*Math.cos(theta), pI=amp*Math.sin(theta), prob=pR*pR+pI*pI;
    var interf=Math.cos(theta), barrier=Math.max(fTotal/pool-freq,0)/(fTotal/pool);
    var tunnel=Math.exp(-1.8*barrier)*0.12, decoh=ago<4?Math.exp(-(4-ago)*0.4):1.0;
    var entangle=eB[num]||0;
    var omega=2*Math.PI/ei, Etotal=0.5*0.5*omega*omega*amp*amp+1/(ago+1);
    var score=(prob*(1+interf*0.5)+tunnel+entangle)*decoh+0.15*Etotal;
    var state=ago<4?"COLLAPSED":interf>0.3?"RESONANT":interf<-0.3?"DESTRUCTIVE":"SUPERPOSED";
    return {num:num,freq:freq,ago:ago,score:score,amplitude:amp,theta:theta,interference:interf,
             tunneling:tunnel,decoherence:decoh,entanglement:entangle,state:state,
      metrics:[["Amplitude",amp.toFixed(5)],["Phase",(theta%(2*Math.PI)).toFixed(4)],
               ["Interference",interf.toFixed(4)],["Tunneling",tunnel.toFixed(4)],
               ["Decoherence",decoh.toFixed(4)],["QE Score",score.toFixed(5)]]};
  });
}

function applyBalanceFilter(cands) {
  var top12 = cands.slice(0,12).map(function(s){return s.num;});
  var best=null, bestB=-Infinity;
  for(var a=0;a<top12.length;a++)
  for(var b=a+1;b<top12.length;b++)
  for(var c=b+1;c<top12.length;c++)
  for(var d=c+1;d<top12.length;d++)
  for(var e=d+1;e<top12.length;e++){
    var cb=[top12[a],top12[b],top12[c],top12[d],top12[e]];
    var sum=cb.reduce(function(x,y){return x+y;},0);
    var odds=cb.filter(function(n){return n%2!==0;}).length;
    var lows=cb.filter(function(n){return n<=35;}).length;
    var ts=cands.filter(function(s){return cb.indexOf(s.num)>=0;}).reduce(function(x,s){return x+s.score;},0);
    var bal=(sum>=100&&sum<=175?2:0)+(odds>=2&&odds<=3?1.5:0)+(lows>=2&&lows<=3?1.5:0)+ts*0.5;
    if(bal>bestB){bestB=bal;best=cb;}
  }
  return best ? best.sort(function(a,b){return a-b;}) : cands.slice(0,5).map(function(s){return s.num;}).sort(function(a,b){return a-b;});
}

var TH = {
  fluid:  {p:"#00e5ff",s:"#0090b8",g:"rgba(0,229,255,0.4)",  bg:"rgba(0,40,80,0.7)",  br:"rgba(0,200,255,0.25)"},
  smart:  {p:"#00e676",s:"#007a40",g:"rgba(0,230,118,0.4)",  bg:"rgba(0,50,20,0.7)",  br:"rgba(0,200,100,0.25)"},
  quantum:{p:"#e040fb",s:"#7b1fa2",g:"rgba(224,64,251,0.4)", bg:"rgba(40,0,60,0.7)",  br:"rgba(200,50,250,0.25)"},
  gold:   {p:"#ffd600",g:"rgba(255,214,0,0.4)"}
};
var MK = ["fluid","smart","quantum"];
var ML = ["Fluid Dynamics","Smart Play","Quantum"];
var MS = ["Navier-Stokes / Reynolds / Bernoulli","Spring Energy / Split Avoidance / Balance","Wave Function / Tunneling / Entanglement"];

function qsc(s){
  if(s==="RESONANT") return "#e040fb";
  if(s==="COLLAPSED") return "#ff3333";
  if(s==="DESTRUCTIVE") return "#448aff";
  return "#a78bfa";
}

function mkPanel(k){
  return {background:TH[k||"fluid"].bg, border:"1px solid "+TH[k||"fluid"].br,
    borderRadius:"8px", padding:"13px", marginBottom:"10px"};
}
function mkLbl(c){
  return {fontSize:"8px", letterSpacing:"0.3em", color:c||"#2a5a90",
    textTransform:"uppercase", marginBottom:"9px", display:"block"};
}

function BallEl(props) {
  var num=props.num, mi=props.mi, size=props.size||60, freq=props.freq;
  var isMega=props.isMega||false, selected=props.selected||false;
  var onClick=props.onClick, showRank=props.showRank||false, rank=props.rank||0;
  var t = isMega ? TH.gold : TH[MK[mi]];
  var sz = size;
  return (
    <div onClick={onClick} style={{textAlign:"center",cursor:onClick?"pointer":"default",userSelect:"none"}}>
      {showRank && <div style={{fontSize:"7px",color:"#1e3a50",marginBottom:"2px"}}>#{rank}</div>}
      <div style={{
        width:sz+"px", height:sz+"px", borderRadius:"50%",
        background:"radial-gradient(circle at 35% 35%,"+(isMega?"#1a0800":"#010610")+",#010408)",
        border:(selected?"3":"2")+"px solid "+t.p,
        boxShadow:selected?"0 0 0 3px "+t.g+",0 0 25px "+t.g+",0 0 45px "+t.g
                          :"0 0 14px "+t.g+",0 0 28px "+t.g+"66",
        display:"flex", alignItems:"center", justifyContent:"center",
        fontSize:Math.round(sz*0.32)+"px", fontWeight:"900", color:t.p,
        margin:"0 auto", transition:"all 0.2s"
      }}>{num}</div>
      {freq != null && <div style={{fontSize:"6px",color:"#1a3050",marginTop:"2px"}}>{freq}x</div>}
    </div>
  );
}

function App() {
  var ballState     = useState(BASE_BALL_DATA);
  var balls         = ballState[0]; var setBalls = ballState[1];
  var megaState     = useState(BASE_MEGA_DATA);
  var mega          = megaState[0]; var setMega = megaState[1];
  var statusState   = useState("loading");
  var appStatus     = statusState[0]; var setAppStatus = statusState[1];
  var infoState     = useState({newDraws:0,lastDate:BASELINE_DATE,total:BASE_DRAWS,error:null});
  var info          = infoState[0]; var setInfo = infoState[1];
  var refreshState  = useState(false);
  var refreshing    = refreshState[0]; var setRefreshing = refreshState[1];
  var tabState      = useState("compare");
  var tab           = tabState[0]; var setTab = tabState[1];
  var selState      = useState(null);
  var sel           = selState[0]; var setSel = selState[1];
  var evState       = useState(false);
  var showEV        = evState[0]; var setShowEV = evState[1];
  var tickState     = useState(0);
  var tick          = tickState[0]; var setTick = tickState[1];

  useEffect(function(){
    var id = setInterval(function(){ setTick(function(t){return t+1;}); }, 2000);
    return function(){ clearInterval(id); };
  }, []);

  function doFetch(isRefresh) {
    if(isRefresh) setRefreshing(true);
    fetchNewDrawings().then(function(nd){
      if(nd.length > 0){
        var merged = mergeDrawings(nd);
        setBalls(merged.balls);
        setMega(merged.mega);
      }
      var lastDate = nd.length>0 ? nd[nd.length-1].draw_date.substring(0,10) : BASELINE_DATE;
      setInfo({newDraws:nd.length, lastDate:lastDate, total:BASE_DRAWS+nd.length, error:null});
      setAppStatus("ready");
      if(isRefresh) setRefreshing(false);
    }).catch(function(e){
      setInfo(function(prev){ return Object.assign({},prev,{error:e.message}); });
      setAppStatus("ready");
      if(isRefresh) setRefreshing(false);
    });
  }

  useEffect(function(){ doFetch(false); }, []);

  var fB = useMemo(function(){ return modelFluid(balls,70,5); }, [balls]);
  var sB = useMemo(function(){ return modelSmart(balls,70,5,info.total); }, [balls,info.total]);
  var qB = useMemo(function(){ return modelQuantum(balls,70,5); }, [balls]);
  var fM = useMemo(function(){ return modelFluid(mega,24,1); }, [mega]);
  var sM = useMemo(function(){ return modelSmart(mega,24,1,info.total); }, [mega,info.total]);
  var qM = useMemo(function(){ return modelQuantum(mega,24,1); }, [mega]);

  var preds = useMemo(function(){
    var fTop=[...fB].sort(function(a,b){return b.score-a.score;});
    var sTop=[...sB].sort(function(a,b){return b.score-a.score;});
    var qTop=[...qB].sort(function(a,b){return b.score-a.score;});
    return [
      {main:fTop.slice(0,5).map(function(s){return s.num;}).sort(function(a,b){return a-b;}),
       mega:[...fM].sort(function(a,b){return b.score-a.score;})[0].num},
      {main:applyBalanceFilter(sTop),
       mega:[...sM].sort(function(a,b){return b.score-a.score;})[0].num},
      {main:qTop.slice(0,5).map(function(s){return s.num;}).sort(function(a,b){return a-b;}),
       mega:[...qM].sort(function(a,b){return b.score-a.score;})[0].num}
    ];
  }, [fB,sB,qB,fM,sM,qM]);

  var allS = [fB,sB,qB];
  var allM = [fM,sM,qM];

  if(appStatus==="loading"){
    return (
      <div style={{background:"#020812",minHeight:"100vh",display:"flex",flexDirection:"column",
        alignItems:"center",justifyContent:"center",fontFamily:"'Courier New',monospace"}}>
        <div style={{fontSize:"16px",fontWeight:"900",color:"#00b8ff",marginBottom:"12px",letterSpacing:"0.15em"}}>
          Loading...
        </div>
      </div>
    );
  }

  var dotColor = info.error ? "#ff6b35" : info.newDraws>0 ? "#00e676" : "#448aff";
  var dotMsg   = info.error ? "API ERROR - BASELINE"
               : info.newDraws>0 ? info.newDraws+" NEW DRAW"+(info.newDraws>1?"S":"")+" LIVE"
               : "LIVE - UP TO DATE";

  return (
    <div style={{background:"linear-gradient(160deg,#020812,#04101e 50%,#030a18)",
      minHeight:"100vh",fontFamily:"'Courier New',monospace",color:"#8ab4d8",
      padding:"14px 14px 56px",position:"relative"}}>

      {/* Header */}
      <div style={{textAlign:"center",marginBottom:"14px"}}>
        <div style={{fontSize:"clamp(13px,3vw,20px)",fontWeight:"900",letterSpacing:"0.17em",
          textTransform:"uppercase",
          background:"linear-gradient(90deg,#00e5ff,#00e676,#e040fb,#00e5ff)",
          backgroundSize:"300% 100%",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",
          animation:"shimmer 5s linear infinite"}}>
          &#9889; MEGA MILLIONS - TRI-MODEL SYSTEM &#9889;
        </div>
        <div style={{fontSize:"8px",color:"#2a4a6a",letterSpacing:"0.15em",marginTop:"4px"}}>
          3 MODELS - {info.total.toLocaleString()} DRAWS - SEP 1996 to {info.lastDate}
          {info.newDraws>0 && <span style={{color:"#00e676"}}> - +{info.newDraws} LIVE</span>}
        </div>

        <div style={{display:"flex",justifyContent:"center",gap:"7px",marginTop:"8px",flexWrap:"wrap"}}>
          {[0,1,2].map(function(i){
            return (
              <div key={i} style={{background:TH[MK[i]].bg,border:"1px solid "+TH[MK[i]].br,
                borderRadius:"14px",padding:"4px 11px",textAlign:"center",minWidth:"110px"}}>
                <div style={{fontSize:"9px",color:TH[MK[i]].p,fontWeight:"bold",letterSpacing:"0.08em"}}>{ML[i]}</div>
                <div style={{fontSize:"7px",color:"#1e3a50",marginTop:"1px"}}>{MS[i]}</div>
              </div>
            );
          })}
          <div onClick={function(){setShowEV(!showEV);}} style={{
            background:"rgba(50,10,0,0.7)",border:"1px solid rgba(200,50,0,0.3)",
            borderRadius:"14px",padding:"4px 11px",textAlign:"center",cursor:"pointer",minWidth:"100px"}}>
            <div style={{fontSize:"9px",color:"#ff6b35",fontWeight:"bold"}}>EV NEGATIVE</div>
            <div style={{fontSize:"7px",color:"#1e3a50",marginTop:"1px"}}>$163M - tap</div>
          </div>
        </div>

        {showEV && (
          <div style={{...mkPanel("fluid"),maxWidth:"400px",margin:"8px auto 0",animation:"flowIn 0.25s ease",textAlign:"left"}}>
            <span style={mkLbl("#ff6b35")}>Expected Value - $163M Jackpot</span>
            {[["Lump sum 60%","$97.8M"],["After tax 63%","$61.6M"],["Odds","1 in 302,575,350"],
              ["EV per $2 ticket","$0.204"],["Net EV","-$1.796"],["Break-even","~$700M"]
            ].map(function(row){
              var k=row[0],v=row[1];
              return (
                <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"2px 0",borderBottom:"1px solid rgba(0,100,200,0.1)"}}>
                  <span style={{fontSize:"9px",color:"#2a5070"}}>{k}</span>
                  <span style={{fontSize:"9px",color:k==="Net EV"?"#ff6b35":"#82b1ff"}}>{v}</span>
                </div>
              );
            })}
            <div style={{marginTop:"6px",fontSize:"8px",color:"#1a3050",lineHeight:1.7}}>
              Needs ~$700M for positive EV. Still fun though.
            </div>
          </div>
        )}

        <div style={{fontSize:"7px",color:"#0c1d2e",marginTop:"6px",letterSpacing:"0.1em"}}>
          ENTERTAINMENT ONLY - STATISTICALLY INDEPENDENT DRAWS - 1-IN-302,575,350 ODDS
        </div>

                  animation:s.state==="RESONANT"?"qFlick 3.5s ease-in-out infinite":"none"}}>
                <div style={{fontSize:"clamp(8px,1.2vw,11px)",color:isP?"#fff":sCol,fontWeight:isP?"bold":"normal"}}>{s.num}</div>
                <div style={{fontSize:"6px",color:"#2a1040",marginTop:"1px"}}>
                  {s.state==="RESONANT"?"~":s.state==="COLLAPSED"?"x":s.state==="DESTRUCTIVE"?"v":"o"}
                </div>
                {isP && <div style={{position:"absolute",top:"-2px",right:"-2px",width:"5px",height:"5px",
                  borderRadius:"50%",background:"#fff",animation:"pulse 1.5s ease-in-out infinite"}}/>}
              </div>
            );
          })}
        </div>
        <div style={{display:"flex",gap:"9px",flexWrap:"wrap",justifyContent:"center"}}>
          {[["#e040fb","~ RESONANT"],["#ff3333","x COLLAPSED"],["#448aff","v DESTRUCTIVE"],["#a78bfa","o SUPERPOSED"]].map(function(row){
            var c=row[0],l=row[1];
            return (
              <div key={l} style={{display:"flex",alignItems:"center",gap:"3px"}}>
                <div style={{width:"7px",height:"7px",borderRadius:"50%",background:c}}/>
                <span style={{fontSize:"7px",color:"#3a2070"}}>{l}</span>
              </div>
            );
          })}
        </div>
      </div>

      <div style={mkPanel("quantum")}>
        <span style={mkLbl(t.s)}>Entangled Pairs</span>
        <div style={{display:"flex",flexWrap:"wrap",gap:"6px",marginBottom:"7px"}}>
          {ENTANGLED_PAIRS.map(function(pair){
            var a=pair[0],b=pair[1];
            return (
              <div key={a+"-"+b} style={{display:"flex",alignItems:"center",gap:"4px",
                background:"rgba(30,0,60,0.6)",border:"1px solid rgba(200,50,255,0.18)",
                borderRadius:"18px",padding:"3px 9px"}}>
                <span style={{fontSize:"11px",fontWeight:"bold",color:t.p}}>{a}</span>
                <span style={{fontSize:"8px",color:"#3a1060"}}>&lt;&gt;</span>
                <span style={{fontSize:"11px",fontWeight:"bold",color:t.p}}>{b}</span>
              </div>
            );
          })}
        </div>
        <div style={{fontSize:"8px",color:"#1a1030",lineHeight:1.7}}>
          Correlated pairs share +0.08 amplitude boost in the wave function.
        </div>
      </div>

      <div style={mkPanel("quantum")}>
        <span style={mkLbl(t.s)}>Top 15 by Quantum Score</span>
        {sorted.slice(0,15).map(function(s,i){
          var pct=(s.score/maxS)*100, sCol=qsc(s.state);
          return (
            <div key={s.num} onClick={function(){setSel(sel&&sel.num===s.num&&sel.mi===2?null:{mi:2,num:s.num});}}
              style={{marginBottom:"5px",display:"flex",alignItems:"center",gap:"6px",cursor:"pointer"}}>
              <div style={{width:"18px",fontSize:"7px",color:"#1e1040",textAlign:"right"}}>#{i+1}</div>
              <div style={{width:"22px",fontSize:"10px",fontWeight:"bold",textAlign:"center",
                color:predSet[s.num]?"#fff":t.p}}>{s.num}</div>
              <div style={{flex:1,height:"6px",background:"rgba(20,0,40,0.8)",borderRadius:"3px",overflow:"hidden"}}>
                <div style={{height:"100%",width:pct+"%",background:"linear-gradient(90deg,"+t.p+"55,"+t.p+")",borderRadius:"3px"}}/>
              </div>
              <div style={{width:"65px",fontSize:"7px",color:sCol,textAlign:"right"}}>{s.state}</div>
              <div style={{width:"42px",fontSize:"8px",color:"#3a2070",textAlign:"right"}}>{s.score.toFixed(3)}</div>
              <div style={{width:"8px",fontSize:"8px",color:"#ffd600"}}>{predSet[s.num]?"*":""}</div>
            </div>
          );
        })}
      </div>

      {det && (
        <div style={{...mkPanel("quantum"),animation:"flowIn 0.25s ease"}}>
          <span style={mkLbl(t.p)}>Ball {det.num} - Quantum Metrics</span>
          <div style={{display:"flex",flexWrap:"wrap",gap:"16px"}}>
            <div style={{textAlign:"center",minWidth:"60px"}}>
              <div style={{fontSize:"28px",fontWeight:"900",color:t.p}}>{det.num}</div>
              <div style={{fontSize:"7px",color:"#1e1040"}}>{det.freq} draws</div>
              <div style={{fontSize:"7px",color:qsc(det.state),marginTop:"2px"}}>{det.state}</div>
              {det.entanglement>0 && <div style={{fontSize:"7px",color:t.p,marginTop:"1px"}}>ENTANGLED</div>}
            </div>
            <div style={{flex:1,display:"grid",gridTemplateColumns:"1fr 1fr",gap:"5px 16px"}}>
              {det.metrics&&det.metrics.map(function(row){
                var k=row[0],v=row[1];
                return (
                  <div key={k}>
                    <div style={{fontSize:"7px",color:"#1e1040",letterSpacing:"0.1em"}}>{k.toUpperCase()}</div>
                    <div style={{fontSize:"12px",color:t.p}}>{v}</div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

var rootEl = ReactDOM.createRoot(document.getElementById("root"));
rootEl.render(React.createElement(App, null));

setTimeout(function(){
  var l = document.getElementById("loading");
  if(l){ l.style.opacity="0"; setTimeout(function(){l.remove();},600); }
}, 1400);
</script>
</body>
</html>
