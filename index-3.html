// =====================================================================
// HYPERGEOMETRIC PROBABILITY TABLE
// P(X=k) when drawing 5 from pool of 70 where 5 are "winners"
// C(70,5) = 12,607,306
// =====================================================================
const HYPER_PROB = [
  8259888/12607306,  // k=0  65.52%
  3385200/12607306,  // k=1  26.85%
   436800/12607306,  // k=2   3.46%
    20800/12607306,  // k=3   0.165%  ~1 in 606
      325/12607306,  // k=4   0.00258%  ~1 in 38,791
        1/12607306   // k=5   ~1 in 12.6M
];
const HYPER_1IN = [1.53, 3.72, 28.87, 606.1, 38791, 12607306];
const MB_PROB = 1/24;
const EXP_HITS_PER_DRAW = 5 * (5/70);  // 0.35714

function prizeTier(mainHits, mbHit) {
  if (mainHits===5 && mbHit) return {label:"JACKPOT", color:"#ffd600"};
  if (mainHits===5)          return {label:"$1,000,000", color:"#ff8c00"};
  if (mainHits===4 && mbHit) return {label:"$10,000", color:"#ff6b35"};
  if (mainHits===4)          return {label:"$500", color:"#00e676"};
  if (mainHits===3 && mbHit) return {label:"$200", color:"#00e676"};
  if (mainHits===3)          return {label:"$10", color:"#82b1ff"};
  if (mainHits===2 && mbHit) return {label:"$10", color:"#82b1ff"};
  if (mainHits===1 && mbHit) return {label:"$4", color:"#5c6bc0"};
  if (mainHits===0 && mbHit) return {label:"$2", color:"#5c6bc0"};
  return {label:"No Prize", color:"#283593"};
}

// =====================================================================
// STORAGE (localStorage with window.storage fallback for claude.ai)
// =====================================================================
var STORAGE_KEY = "mm_tracker_v1";
async function storageLoad() {
  try {
    if (window.storage && window.storage.get) {
      var r = await window.storage.get(STORAGE_KEY);
      return r ? JSON.parse(r.value) : [];
    }
  } catch(e) {}
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}
async function storageSave(data) {
  var str = JSON.stringify(data);
  try {
    if (window.storage && window.storage.set) {
      await window.storage.set(STORAGE_KEY, str);
      return;
    }
  } catch(e) {}
  try { localStorage.setItem(STORAGE_KEY, str); } catch(e) {}
}

// =====================================================================
// LIVE FETCH & MERGE
// =====================================================================
async function fetchNewDrawings() {
  var url = API_URL + "?$order=draw_date%20DESC&$limit=200";
  var res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  var data = await res.json();
  return data
    .filter(function(d){ return (d.draw_date||"").substring(0,10) > BASELINE_DATE; })
    .sort(function(a,b){ return a.draw_date.localeCompare(b.draw_date); });
}
function mergeDrawings(newDraws) {
  var bm={}, mm={};
  BASE_BALL_DATA.forEach(function(r){ bm[r[0]]=[r[0],r[1],r[2]]; });
  BASE_MEGA_DATA.forEach(function(r){ mm[r[0]]=[r[0],r[1],r[2]]; });
  var total=newDraws.length;
  newDraws.forEach(function(d,idx){
    var balls=(d.winning_numbers||"").trim().split(/\s+/).map(Number).filter(function(n){return n>=1&&n<=70;});
    var mega=parseInt(d.mega_ball||"0",10);
    var ago=total-idx;
    balls.forEach(function(n){if(bm[n]){bm[n][1]+=1;bm[n][2]=ago;}});
    if(mm[mega]){mm[mega][1]+=1;mm[mega][2]=ago;}
  });
  if(total>0){
    var last=newDraws[total-1];
    var lb=(last.winning_numbers||"").trim().split(/\s+/).map(Number);
    var lm=parseInt(last.mega_ball||"0",10);
    lb.forEach(function(n){if(bm[n])bm[n][2]=1;});
    if(mm[lm])mm[lm][2]=1;
  }
  return {balls:Object.values(bm),mega:Object.values(mm)};
}

// =====================================================================
// THREE MODELS
// =====================================================================
function modelFluid(data,pool,bpd){
  var freqs=data.map(function(d){return d[1];});
  var fMean=freqs.reduce(function(a,b){return a+b;},0)/freqs.length;
  var fMax=Math.max.apply(null,freqs),fMin=Math.min.apply(null,freqs);
  return data.map(function(r){
    var num=r[0],freq=r[1],ago=r[2];
    var P=freq/fMean,ei=pool/bpd,v=Math.min(ei/(ago+1),3.0);
    var Re=(v*pool)/0.08,B=P+0.5*v*v,w=Math.abs(P-1);
    var od=ago>ei*2?0.25*Math.min(ago/(ei*8),0.5):0;
    var score=0.38*v+0.30*P+0.18*(1/(w+0.4))+0.09*(freq/fMax)+0.05*((freq-fMin)/(fMax-fMin+1))+od;
    return{num,freq,ago,score,P,v,Re,B,w,regime:Re>4000?"turbulent":Re>2300?"transitional":"laminar",
      metrics:[["Pressure P",P.toFixed(4)],["Velocity v",v.toFixed(4)],["Reynolds",Math.round(Re)],
               ["Bernoulli B",B.toFixed(4)],["Vorticity w",w.toFixed(4)],["NS-Score",score.toFixed(5)]]};
  });
}
function modelSmart(data,pool,bpd,totalDraws){
  var freqs=data.map(function(d){return d[1];});
  var fMax=Math.max.apply(null,freqs),fMin=Math.min.apply(null,freqs),ei=pool/bpd;
  function popW(n){var w=1;if(n<=31)w*=1.85;if(n<=12)w*=1.20;if(n%10===0)w*=1.30;if([7,11,13,17,21,23].indexOf(n)>=0)w*=1.40;return w;}
  return data.map(function(r){
    var num=r[0],freq=r[1],ago=r[2];
    var comp=Math.max(ago-ei,0),springE=0.5*comp*comp/(ei*ei);
    var expF=totalDraws/pool*bpd,freqDef=Math.max(expF-freq,0)/expF;
    var pop=popW(num),unpop=1/pop,recPen=ago<3?0.15*(3-ago):0;
    var score=0.35*springE+0.25*unpop+0.20*freqDef+0.15*((freq-fMin)/(fMax-fMin+1))-recPen;
    return{num,freq,ago,score,springE,unpop,freqDef,pop,
      tag:pop>1.5?"Overplayed":pop>1.2?"Popular":"Contrarian",
      metrics:[["Spring E",springE.toFixed(4)],["Unpopularity",unpop.toFixed(4)],
               ["Freq Deficit",freqDef.toFixed(4)],["Pop Weight",pop.toFixed(2)],
               ["Smart Score",score.toFixed(5)]]};
  });
}
function modelQuantum(data,pool,bpd){
  var freqs=data.map(function(d){return d[1];});
  var fTotal=freqs.reduce(function(a,b){return a+b;},0),ei=pool/bpd;
  var eB={};
  ENTANGLED_PAIRS.forEach(function(p){eB[p[0]]=(eB[p[0]]||0)+0.08;eB[p[1]]=(eB[p[1]]||0)+0.08;});
  return data.map(function(r){
    var num=r[0],freq=r[1],ago=r[2];
    var amp=Math.sqrt(freq/fTotal),theta=(2*Math.PI*ago)/ei;
    var pR=amp*Math.cos(theta),pI=amp*Math.sin(theta),prob=pR*pR+pI*pI;
    var interf=Math.cos(theta),barrier=Math.max(fTotal/pool-freq,0)/(fTotal/pool);
    var tunnel=Math.exp(-1.8*barrier)*0.12,decoh=ago<4?Math.exp(-(4-ago)*0.4):1.0;
    var entangle=eB[num]||0,omega=2*Math.PI/ei;
    var Etotal=0.5*0.5*omega*omega*amp*amp+1/(ago+1);
    var score=(prob*(1+interf*0.5)+tunnel+entangle)*decoh+0.15*Etotal;
    var state=ago<4?"COLLAPSED":interf>0.3?"RESONANT":interf<-0.3?"DESTRUCTIVE":"SUPERPOSED";
    return{num,freq,ago,score,amplitude:amp,theta,interference:interf,tunneling:tunnel,
           decoherence:decoh,entanglement:entangle,state,
      metrics:[["Amplitude",amp.toFixed(5)],["Phase",(theta%(2*Math.PI)).toFixed(4)],
               ["Interference",interf.toFixed(4)],["Tunneling",tunnel.toFixed(4)],
               ["Decoherence",decoh.toFixed(4)],["QE Score",score.toFixed(5)]]};
  });
}
function applyBalanceFilter(cands){
  var top12=cands.slice(0,12).map(function(s){return s.num;});
  var best=null,bestB=-Infinity;
  for(var a=0;a<top12.length;a++)
  for(var b=a+1;b<top12.length;b++)
  for(var c=b+1;c<top12.length;c++)
  for(var d=c+1;d<top12.length;d++)
  for(var e=d+1;e<top12.length;e++){
    var cb=[top12[a],top12[b],top12[c],top12[d],top12[e]];
    var sum=cb.reduce(function(x,y){return x+y;},0);
    var odds=cb.filter(function(n){return n%2!==0;}).length;
    var lows=cb.filter(function(n){return n<=35;}).length;
    var ts=cands.filter(function(s){return cb.indexOf(s.num)>=0;}).reduce(function(x,s){return x+s.score;},0);
    var bal=(sum>=100&&sum<=175?2:0)+(odds>=2&&odds<=3?1.5:0)+(lows>=2&&lows<=3?1.5:0)+ts*0.5;
    if(bal>bestB){bestB=bal;best=cb;}
  }
  return best?best.sort(function(a,b){return a-b;}):cands.slice(0,5).map(function(s){return s.num;}).sort(function(a,b){return a-b;});
}

// =====================================================================
// TRACKER COMPONENT
// =====================================================================
function TrackerTab(props){
  var currentPreds=props.currentPreds;
  var history=props.history, setHistory=props.setHistory;

  var showFormState=useState(false);
  var showForm=showFormState[0], setShowForm=showFormState[1];

  var formState=useState({
    date:"2026-05-08",
    m1:"37",m2:"47",m3:"49",m4:"51",m5:"58",mb:"16",
    capturePreds:true,
    // pre-fill with currentPreds
    fp1:"",fp2:"",fp3:"",fp4:"",fp5:"",fmb:"",
    sp1:"",sp2:"",sp3:"",sp4:"",sp5:"",smb:"",
    qp1:"",qp2:"",qp3:"",qp4:"",qp5:"",qmb:""
  });
  var form=formState[0], setForm=formState[1];

  var errState=useState("");
  var err=errState[0], setErr=errState[1];

  // When form opens, pre-fill predictions from current model picks
  function openForm(){
    var p=currentPreds;
    setForm(function(prev){
      return Object.assign({},prev,{
        fp1:String(p[0].main[0]),fp2:String(p[0].main[1]),fp3:String(p[0].main[2]),fp4:String(p[0].main[3]),fp5:String(p[0].main[4]),fmb:String(p[0].mega),
        sp1:String(p[1].main[0]),sp2:String(p[1].main[1]),sp3:String(p[1].main[2]),sp4:String(p[1].main[3]),sp5:String(p[1].main[4]),smb:String(p[1].mega),
        qp1:String(p[2].main[0]),qp2:String(p[2].main[1]),qp3:String(p[2].main[2]),qp4:String(p[2].main[3]),qp5:String(p[2].main[4]),qmb:String(p[2].mega)
      });
    });
    setShowForm(true);
  }

  function upd(field,val){ setForm(function(prev){var o=Object.assign({},prev);o[field]=val;return o;}); }

  function validateAndAdd(){
    var actual=[parseInt(form.m1),parseInt(form.m2),parseInt(form.m3),parseInt(form.m4),parseInt(form.m5)];
    var actMB=parseInt(form.mb);
    if(actual.some(isNaN)||isNaN(actMB)){setErr("Enter all 5 winning numbers + Mega Ball");return;}
    if(actual.some(function(n){return n<1||n>70;})){setErr("Main numbers must be 1-70");return;}
    if(actMB<1||actMB>24){setErr("Mega Ball must be 1-24");return;}
    if(new Set(actual).size!==5){setErr("Main numbers must all be different");return;}
    if(!form.date){setErr("Enter draw date");return;}

    var preds=[
      {model:"fluid",  main:[form.fp1,form.fp2,form.fp3,form.fp4,form.fp5].map(Number),mega:parseInt(form.fmb)||0},
      {model:"smart",  main:[form.sp1,form.sp2,form.sp3,form.sp4,form.sp5].map(Number),mega:parseInt(form.smb)||0},
      {model:"quantum",main:[form.qp1,form.qp2,form.qp3,form.qp4,form.qp5].map(Number),mega:parseInt(form.qmb)||0}
    ];

    var entry={
      id:Date.now()+"",
      date:form.date,
      actual:{main:actual.sort(function(a,b){return a-b;}),mega:actMB},
      preds:preds
    };
    var updated=[entry].concat(history);
    storageSave(updated);
    setHistory(updated);
    setShowForm(false);
    setErr("");
  }

  function removeEntry(id){
    var updated=history.filter(function(h){return h.id!==id;});
    storageSave(updated);
    setHistory(updated);
  }

  // Compute stats per model
  function computeStats(){
    var models=["fluid","smart","quantum"];
    var result={};
    models.forEach(function(model){
      var relevant=history.filter(function(h){
        return h.preds.some(function(p){return p.model===model&&p.main&&p.main.length===5;});
      });
      var totalHits=0,totalMBHits=0,hitDist=[0,0,0,0,0,0];
      relevant.forEach(function(h){
        var pred=h.preds.filter(function(p){return p.model===model;})[0];
        if(!pred||!pred.main||pred.main.length!==5)return;
        var hits=pred.main.filter(function(n){return h.actual.main.indexOf(n)>=0;}).length;
        var mbHit=pred.mega===h.actual.mega?1:0;
        totalHits+=hits;
        totalMBHits+=mbHit;
        if(hits<=5)hitDist[hits]++;
      });
      var n=relevant.length;
      var avgHits=n>0?totalHits/n:0;
      var avgMB=n>0?totalMBHits/n:0;
      result[model]={
        n:n,totalHits:totalHits,totalMBHits:totalMBHits,
        avgHits:avgHits,avgMB:avgMB,hitDist:hitDist,
        perfRatio:n>0?avgHits/EXP_HITS_PER_DRAW:null,
        mbRatio:n>0?(avgMB/MB_PROB):null,
        expectedTotalHits:n*EXP_HITS_PER_DRAW,
        expectedMBHits:n*MB_PROB
      };
    });
    return result;
  }
  var stats=computeStats();

  var modelColors=["#00e5ff","#00e676","#e040fb"];
  var modelNames=["Fluid","Smart","Quantum"];

  function NumberInput(props){
    var f=props.field,v=form[f]||"",min=props.min||1,max=props.max||70,w=props.w||"44px";
    return (
      <input type="number" min={min} max={max} value={v}
        onChange={function(e){upd(f,e.target.value);}}
        style={{width:w,background:"#030e1e",border:"1px solid rgba(0,160,255,0.3)",
          color:"#82b1ff",borderRadius:"4px",padding:"4px 2px",
          textAlign:"center",fontSize:"12px",outline:"none"}}/>
    );
  }

  var panelTracker=mkPanel("tracker");
  var lblTracker=mkLbl(TH.tracker.p);

  return (
    <div style={{position:"relative",zIndex:1}}>

      {/* Stats Panel */}
      <div style={{...panelTracker,marginBottom:"12px"}}>
        <span style={lblTracker}>Model Performance vs Expected Odds</span>

        {history.length===0 ? (
          <div style={{textAlign:"center",padding:"16px 0",fontSize:"9px",color:"#2a3a20",letterSpacing:"0.15em"}}>
            No draws logged yet. Log your first draw result to start tracking.
          </div>
        ) : (
          <div>
            {/* Per-model stat cards */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"8px",marginBottom:"12px"}}>
              {["fluid","smart","quantum"].map(function(model,mi){
                var s=stats[model];
                var pr=s.perfRatio;
                var mbr=s.mbRatio;
                var c=modelColors[mi];
                var perfColor=pr===null?"#2a5070":pr>1.5?"#00e676":pr>0.5?"#ffab40":"#ff6b35";
                var mbColor=mbr===null?"#2a5070":mbr>1.5?"#00e676":mbr>0.5?"#ffab40":"#ff6b35";
                return (
                  <div key={model} style={{background:"rgba(0,10,25,0.8)",
                    border:"1px solid "+c+"33",borderRadius:"6px",padding:"10px"}}>
                    <div style={{fontSize:"9px",color:c,fontWeight:"bold",letterSpacing:"0.1em",marginBottom:"8px"}}>
                      {modelNames[mi]}
                    </div>

                    {s.n===0 ? (
                      <div style={{fontSize:"8px",color:"#1a3050"}}>No data yet</div>
                    ) : (
                      <div>
                        {/* Main numbers */}
                        <div style={{marginBottom:"6px"}}>
                          <div style={{fontSize:"7px",color:"#1a3050",letterSpacing:"0.15em",marginBottom:"3px"}}>MAIN NUMBERS</div>
                          <div style={{display:"flex",justifyContent:"space-between",marginBottom:"2px"}}>
                            <span style={{fontSize:"8px",color:"#2a5070"}}>Total hits</span>
                            <span style={{fontSize:"9px",color:c}}>{s.totalHits} / {s.n*5}</span>
                          </div>
                          <div style={{display:"flex",justifyContent:"space-between",marginBottom:"2px"}}>
                            <span style={{fontSize:"8px",color:"#2a5070"}}>Avg per draw</span>
                            <span style={{fontSize:"9px",color:c}}>{s.avgHits.toFixed(3)}</span>
                          </div>
                          <div style={{display:"flex",justifyContent:"space-between",marginBottom:"4px"}}>
                            <span style={{fontSize:"8px",color:"#2a5070"}}>Expected (chance)</span>
                            <span style={{fontSize:"9px",color:"#2a5070"}}>{EXP_HITS_PER_DRAW.toFixed(3)}</span>
                          </div>
                          <div style={{display:"flex",justifyContent:"space-between",padding:"4px 6px",
                            background:"rgba(0,30,10,0.5)",borderRadius:"4px",
                            border:"1px solid "+perfColor+"44"}}>
                            <span style={{fontSize:"8px",color:"#2a5070",fontWeight:"bold"}}>PERFORMANCE</span>
                            <span style={{fontSize:"11px",color:perfColor,fontWeight:"bold"}}>
                              {pr===null?"—":pr.toFixed(2)+"x"}
                            </span>
                          </div>
                        </div>

                        {/* Mega ball */}
                        <div style={{marginBottom:"6px"}}>
                          <div style={{fontSize:"7px",color:"#1a3050",letterSpacing:"0.15em",marginBottom:"3px"}}>MEGA BALL</div>
                          <div style={{display:"flex",justifyContent:"space-between",marginBottom:"2px"}}>
                            <span style={{fontSize:"8px",color:"#2a5070"}}>Hits / draws</span>
                            <span style={{fontSize:"9px",color:"#ffd600"}}>{s.totalMBHits} / {s.n}</span>
                          </div>
                          <div style={{display:"flex",justifyContent:"space-between",marginBottom:"4px"}}>
                            <span style={{fontSize:"8px",color:"#2a5070"}}>Expected (1/24)</span>
                            <span style={{fontSize:"9px",color:"#2a5070"}}>{s.expectedMBHits.toFixed(2)}</span>
                          </div>
                          <div style={{display:"flex",justifyContent:"space-between",padding:"4px 6px",
                            background:"rgba(30,20,0,0.5)",borderRadius:"4px",
                            border:"1px solid "+mbColor+"44"}}>
                            <span style={{fontSize:"8px",color:"#2a5070",fontWeight:"bold"}}>MB PERF</span>
                            <span style={{fontSize:"11px",color:mbColor,fontWeight:"bold"}}>
                              {mbr===null?"—":mbr.toFixed(2)+"x"}
                            </span>
                          </div>
                        </div>

                        {/* Hit distribution */}
                        <div>
                          <div style={{fontSize:"7px",color:"#1a3050",letterSpacing:"0.15em",marginBottom:"3px"}}>HIT DISTRIBUTION</div>
                          <div style={{display:"flex",gap:"3px"}}>
                            {[0,1,2,3,4,5].map(function(k){
                              var cnt=s.hitDist[k]||0;
                              var pct=s.n>0?cnt/s.n:0;
                              var expPct=HYPER_PROB[k];
                              var barH=Math.max(2,pct*50);
                              var barColor=pct>expPct*1.5?"#00e676":pct>0?"#448aff":"#0a1a30";
                              return (
                                <div key={k} style={{flex:1,textAlign:"center"}}>
                                  <div style={{display:"flex",alignItems:"flex-end",justifyContent:"center",height:"30px",marginBottom:"2px"}}>
                                    <div style={{width:"80%",height:barH+"px",background:barColor,
                                      borderRadius:"2px 2px 0 0",opacity:0.85}}/>
                                  </div>
                                  <div style={{fontSize:"7px",color:cnt>0?c:"#1a2a40",fontWeight:cnt>0?"bold":"normal"}}>{cnt}</div>
                                  <div style={{fontSize:"6px",color:"#0c1a30"}}>{k}x</div>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {/* Probability reference table */}
            <div style={{background:"rgba(0,10,25,0.8)",border:"1px solid rgba(0,100,200,0.15)",
              borderRadius:"6px",padding:"10px"}}>
              <span style={mkLbl("#1e4060")}>Probability Reference (Hypergeometric — 5 from 70)</span>
              <div style={{display:"flex",gap:"6px",flexWrap:"wrap"}}>
                {[0,1,2,3,4,5].map(function(k){
                  var prob=HYPER_PROB[k];
                  var oneIn=HYPER_1IN[k];
                  var c2=k>=3?"#ff6b35":k>=2?"#ffab40":"#2a5070";
                  return (
                    <div key={k} style={{background:"rgba(0,20,50,0.6)",border:"1px solid rgba(0,100,200,0.2)",
                      borderRadius:"4px",padding:"6px 10px",textAlign:"center",minWidth:"75px",flex:1}}>
                      <div style={{fontSize:"12px",fontWeight:"900",color:c2,marginBottom:"2px"}}>{k} match{k!==1?"es":""}</div>
                      <div style={{fontSize:"8px",color:"#2a5070",marginBottom:"1px"}}>{(prob*100).toFixed(k>=3?3:2)}%</div>
                      <div style={{fontSize:"7px",color:"#1a3050"}}>1 in {oneIn<100?oneIn.toFixed(1):Math.round(oneIn).toLocaleString()}</div>
                    </div>
                  );
                })}
              </div>
              <div style={{marginTop:"6px",fontSize:"8px",color:"#1a3050",lineHeight:1.8}}>
                Expected hits per draw by pure chance: {EXP_HITS_PER_DRAW.toFixed(4)} ({(EXP_HITS_PER_DRAW*100).toFixed(2)}% of picked balls).
                Mega Ball: 1/24 = {(MB_PROB*100).toFixed(2)}%.
                Performance ratio &gt;1.0x means the model outperforms random chance.
              </div>
            </div>
          </div>
        )}
      </div>

      {/* Add Draw Button */}
      <div style={{display:"flex",justifyContent:"center",marginBottom:"10px"}}>
        <button onClick={openForm} style={{
          padding:"8px 24px",fontSize:"9px",letterSpacing:"0.2em",textTransform:"uppercase",
          background:"rgba(255,140,0,0.15)",border:"1px solid rgba(255,140,0,0.6)",
          color:"#ffab40",borderRadius:"4px",cursor:"pointer",fontFamily:"inherit",
          transition:"all 0.2s",display:"flex",alignItems:"center",gap:"6px"}}>
          <span style={{fontSize:"14px"}}>+</span> LOG DRAW RESULT
        </button>
      </div>

      {/* Add Draw Form */}
      {showForm&&(
        <div style={{...mkPanel("tracker"),animation:"flowIn 0.3s ease",marginBottom:"12px"}}>
          <span style={lblTracker}>Log Actual Winning Numbers</span>

          {/* Date */}
          <div style={{marginBottom:"12px"}}>
            <div style={{fontSize:"8px",color:"#2a3a20",letterSpacing:"0.2em",marginBottom:"4px"}}>DRAW DATE</div>
            <input type="date" value={form.date}
              onChange={function(e){upd("date",e.target.value);}}
              style={{background:"#030e1e",border:"1px solid rgba(255,140,0,0.3)",color:"#ffab40",
                borderRadius:"4px",padding:"5px 8px",fontSize:"12px",outline:"none"}}/>
          </div>

          {/* Actual numbers */}
          <div style={{marginBottom:"14px"}}>
            <div style={{fontSize:"8px",color:"#2a3a20",letterSpacing:"0.2em",marginBottom:"6px"}}>
              ACTUAL WINNING NUMBERS (5 main + Mega Ball)
            </div>
            <div style={{display:"flex",gap:"6px",alignItems:"center",flexWrap:"wrap"}}>
              {["m1","m2","m3","m4","m5"].map(function(f){
                return <NumberInput key={f} field={f} min={1} max={70} w="48px"/>;
              })}
              <div style={{fontSize:"10px",color:"#ffd600",margin:"0 4px"}}>+</div>
              <NumberInput field="mb" min={1} max={24} w="48px"/>
              <div style={{fontSize:"8px",color:"#3a2000",marginLeft:"4px"}}>MB</div>
            </div>
          </div>

          {/* Model predictions (editable, pre-filled from current picks) */}
          <div style={{marginBottom:"12px"}}>
            <div style={{fontSize:"8px",color:"#2a3a20",letterSpacing:"0.2em",marginBottom:"8px"}}>
              MODEL PREDICTIONS (pre-filled from current picks — edit if needed)
            </div>
            {[
              {model:"fluid",  fields:["fp1","fp2","fp3","fp4","fp5","fmb"], label:"Fluid", color:"#00e5ff"},
              {model:"smart",  fields:["sp1","sp2","sp3","sp4","sp5","smb"], label:"Smart", color:"#00e676"},
              {model:"quantum",fields:["qp1","qp2","qp3","qp4","qp5","qmb"],label:"Quantum",color:"#e040fb"}
            ].map(function(row){
              return (
                <div key={row.model} style={{display:"flex",alignItems:"center",gap:"6px",
                  marginBottom:"6px",flexWrap:"wrap"}}>
                  <div style={{width:"52px",fontSize:"8px",color:row.color,letterSpacing:"0.08em"}}>{row.label}</div>
                  {row.fields.slice(0,5).map(function(f){
                    return <NumberInput key={f} field={f} min={1} max={70} w="44px"/>;
                  })}
                  <div style={{fontSize:"10px",color:"#ffd600",margin:"0 2px"}}>+</div>
                  <NumberInput field={row.fields[5]} min={1} max={24} w="44px"/>
                  <div style={{fontSize:"7px",color:"#3a2000"}}>MB</div>
                </div>
              );
            })}
          </div>

          {err&&<div style={{fontSize:"9px",color:"#ff6b35",marginBottom:"8px"}}>{err}</div>}

          <div style={{display:"flex",gap:"8px"}}>
            <button onClick={validateAndAdd} style={{
              padding:"7px 20px",fontSize:"9px",letterSpacing:"0.15em",textTransform:"uppercase",
              background:"rgba(255,140,0,0.2)",border:"1px solid rgba(255,140,0,0.7)",
              color:"#ffab40",borderRadius:"4px",cursor:"pointer",fontFamily:"inherit"}}>
              SAVE DRAW
            </button>
            <button onClick={function(){setShowForm(false);setErr("");}} style={{
              padding:"7px 16px",fontSize:"9px",letterSpacing:"0.15em",textTransform:"uppercase",
              background:"transparent",border:"1px solid rgba(100,100,100,0.3)",
              color:"#3a5070",borderRadius:"4px",cursor:"pointer",fontFamily:"inherit"}}>
              CANCEL
            </button>
          </div>
        </div>
      )}

      {/* History Table */}
      {history.length>0&&(
        <div style={panelTracker}>
          <span style={lblTracker}>Draw History ({history.length} draw{history.length!==1?"s":""})</span>
          <div style={{overflowX:"auto"}}>
            {history.map(function(h){
              return (
                <div key={h.id} style={{background:"rgba(0,8,20,0.7)",border:"1px solid rgba(255,140,0,0.12)",
                  borderRadius:"6px",padding:"10px",marginBottom:"8px",animation:"flowIn 0.3s ease"}}>

                  {/* Header row */}
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px",flexWrap:"wrap",gap:"6px"}}>
                    <span style={{fontSize:"10px",color:TH.tracker.p,fontWeight:"bold",letterSpacing:"0.1em"}}>
                      {h.date}
                    </span>
                    <div style={{display:"flex",gap:"6px",alignItems:"center"}}>
                      {/* Actual balls */}
                      <div style={{display:"flex",gap:"3px",alignItems:"center"}}>
                        {h.actual.main.map(function(n){
                          return (
                            <div key={n} style={{width:"26px",height:"26px",borderRadius:"50%",
                              background:"#0a1428",border:"1px solid rgba(255,171,64,0.5)",
                              display:"flex",alignItems:"center",justifyContent:"center",
                              fontSize:"9px",fontWeight:"bold",color:TH.tracker.p}}>{n}</div>
                          );
                        })}
                        <div style={{width:"26px",height:"26px",borderRadius:"50%",
                          background:"#1a0800",border:"1px solid #ffd600",
                          display:"flex",alignItems:"center",justifyContent:"center",
                          fontSize:"9px",fontWeight:"bold",color:"#ffd600",marginLeft:"3px"}}>{h.actual.mega}</div>
                      </div>
                      <button onClick={function(){removeEntry(h.id);}} style={{
                        padding:"2px 8px",fontSize:"8px",background:"transparent",
                        border:"1px solid rgba(100,50,50,0.4)",color:"#4a2020",
                        borderRadius:"3px",cursor:"pointer",fontFamily:"inherit"}}>remove</button>
                    </div>
                  </div>

                  {/* Model results */}
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"6px"}}>
                    {h.preds.map(function(pred,mi){
                      if(!pred||!pred.main||pred.main.length!==5)return null;
                      var modelColor=modelColors[mi];
                      var hits=pred.main.filter(function(n){return h.actual.main.indexOf(n)>=0;}).length;
                      var mbHit=pred.mega===h.actual.mega;
                      var prize=prizeTier(hits,mbHit);
                      return (
                        <div key={pred.model} style={{background:"rgba(0,15,35,0.7)",
                          border:"1px solid "+modelColor+"22",borderRadius:"4px",padding:"7px"}}>
                          <div style={{fontSize:"8px",color:modelColor,letterSpacing:"0.08em",marginBottom:"5px",fontWeight:"bold"}}>
                            {modelNames[mi]}
                          </div>
                          <div style={{display:"flex",gap:"2px",flexWrap:"wrap",marginBottom:"4px"}}>
                            {pred.main.map(function(n){
                              var isHit=h.actual.main.indexOf(n)>=0;
                              return (
                                <div key={n} style={{width:"22px",height:"22px",borderRadius:"50%",
                                  background:isHit?"rgba(0,200,100,0.2)":"rgba(0,0,0,0.3)",
                                  border:"1px solid "+(isHit?"#00e676":"rgba(100,100,100,0.2)"),
                                  display:"flex",alignItems:"center",justifyContent:"center",
                                  fontSize:"8px",fontWeight:isHit?"bold":"normal",
                                  color:isHit?"#00e676":"#2a3a50"}}>{n}</div>
                              );
                            })}
                            <div style={{width:"22px",height:"22px",borderRadius:"50%",
                              background:mbHit?"rgba(255,214,0,0.2)":"rgba(0,0,0,0.3)",
                              border:"1px solid "+(mbHit?"#ffd600":"rgba(100,100,100,0.2)"),
                              display:"flex",alignItems:"center",justifyContent:"center",
                              fontSize:"8px",fontWeight:mbHit?"bold":"normal",
                              color:mbHit?"#ffd600":"#2a3a50",marginLeft:"2px"}}>{pred.mega}</div>
                          </div>
                          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                            <span style={{fontSize:"9px",fontWeight:"bold",
                              color:hits>=3?"#00e676":hits>=1?"#ffab40":"#2a3a50"}}>
                              {hits}/5 {mbHit?"+MB":""}
                            </span>
                            <span style={{fontSize:"8px",color:prize.color,fontWeight:hits>=3?"bold":"normal"}}>
                              {prize.label}
                            </span>
                          </div>
                          {hits>=2&&(
                            <div style={{fontSize:"7px",color:"#1a3050",marginTop:"2px"}}>
                              1-in-{HYPER_1IN[hits]<100?HYPER_1IN[hits].toFixed(1):Math.round(HYPER_1IN[hits]).toLocaleString()} by chance
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// =====================================================================
// ROOT APP
// =====================================================================
function App(){
  var bS=useState(BASE_BALL_DATA); var balls=bS[0],setBalls=bS[1];
  var mS=useState(BASE_MEGA_DATA); var mega=mS[0],setMega=mS[1];
  var stS=useState("loading");     var appStatus=stS[0],setAppStatus=stS[1];
  var iS=useState({newDraws:0,lastDate:BASELINE_DATE,total:BASE_DRAWS,error:null}); var info=iS[0],setInfo=iS[1];
  var rS=useState(false);          var refreshing=rS[0],setRefreshing=rS[1];
  var tS=useState("compare");      var tab=tS[0],setTab=tS[1];
  var seS=useState(null);          var sel=seS[0],setSel=seS[1];
  var eS=useState(false);          var showEV=eS[0],setShowEV=eS[1];
  var tkS=useState(0);             var tick=tkS[0],setTick=tkS[1];
  var hS=useState([]);             var history=hS[0],setHistory=hS[1];

  useEffect(function(){var id=setInterval(function(){setTick(function(t){return t+1;});},2000);return function(){clearInterval(id);};}, []);

  // Load tracker history from storage
  useEffect(function(){
    storageLoad().then(function(data){setHistory(Array.isArray(data)?data:[]);});
  },[]);

  function doFetch(isRefresh){
    if(isRefresh)setRefreshing(true);
    fetchNewDrawings().then(function(nd){
      if(nd.length>0){var m=mergeDrawings(nd);setBalls(m.balls);setMega(m.mega);}
      var lastDate=nd.length>0?nd[nd.length-1].draw_date.substring(0,10):BASELINE_DATE;
      setInfo({newDraws:nd.length,lastDate:lastDate,total:BASE_DRAWS+nd.length,error:null});
      setAppStatus("ready");
      if(isRefresh)setRefreshing(false);
    }).catch(function(e){
      setInfo(function(prev){return Object.assign({},prev,{error:e.message});});
      setAppStatus("ready");
      if(isRefresh)setRefreshing(false);
    });
  }
  useEffect(function(){doFetch(false);},[]);

  var fB=useMemo(function(){return modelFluid(balls,70,5);},[balls]);
  var sB=useMemo(function(){return modelSmart(balls,70,5,info.total);},[balls,info.total]);
  var qB=useMemo(function(){return modelQuantum(balls,70,5);},[balls]);
  var fM=useMemo(function(){return modelFluid(mega,24,1);},[mega]);
  var sM=useMemo(function(){return modelSmart(mega,24,1,info.total);},[mega,info.total]);
  var qM=useMemo(function(){return modelQuantum(mega,24,1);},[mega]);

  var preds=useMemo(function(){
    var fTop=[...fB].sort(function(a,b){return b.score-a.score;});
    var sTop=[...sB].sort(function(a,b){return b.score-a.score;});
    var qTop=[...qB].sort(function(a,b){return b.score-a.score;});
    return [
      {main:fTop.slice(0,5).map(function(s){return s.num;}).sort(function(a,b){return a-b;}),mega:[...fM].sort(function(a,b){return b.score-a.score;})[0].num},
      {main:applyBalanceFilter(sTop),mega:[...sM].sort(function(a,b){return b.score-a.score;})[0].num},
      {main:qTop.slice(0,5).map(function(s){return s.num;}).sort(function(a,b){return a-b;}),mega:[...qM].sort(function(a,b){return b.score-a.score;})[0].num}
    ];
  },[fB,sB,qB,fM,sM,qM]);

  var allS=[fB,sB,qB],allM=[fM,sM,qM];

  if(appStatus==="loading"){
    return (
      <div style={{background:"#020812",minHeight:"100vh",display:"flex",flexDirection:"column",
        alignItems:"center",justifyContent:"center",fontFamily:"'Courier New',monospace"}}>
        <div style={{fontSize:"15px",fontWeight:"900",color:"#00b8ff",letterSpacing:"0.15em"}}>Loading&#8230;</div>
      </div>
    );
  }

  var dotColor=info.error?"#ff6b35":info.newDraws>0?"#00e676":"#448aff";
  var dotMsg=info.error?"API ERROR":info.newDraws>0?info.newDraws+" NEW DRAW"+(info.newDraws>1?"S":"")+" LIVE":"LIVE - UP TO DATE";

  return (
    <div style={{background:"linear-gradient(160deg,#020812,#04101e 50%,#030a18)",
      minHeight:"100vh",fontFamily:"'Courier New',monospace",color:"#8ab4d8",
      padding:"14px 14px 56px"}}>

      <style>{`@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:300% 50%}}
               @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
               @keyframes flowIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
               @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
               @keyframes qFlick{0%,100%{opacity:1}50%{opacity:0.55}}
               .bc:hover{transform:scale(1.11)!important;z-index:10!important}
               .ts{animation:flowIn 0.3s ease}`}</style>

      {/* Header */}
      <div style={{textAlign:"center",marginBottom:"14px"}}>
        <div style={{fontSize:"clamp(12px,2.8vw,19px)",fontWeight:"900",letterSpacing:"0.17em",textTransform:"uppercase",
          background:"linear-gradient(90deg,#00e5ff,#00e676,#e040fb,#ffab40,#00e5ff)",backgroundSize:"300% 100%",
          WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",animation:"shimmer 5s linear infinite"}}>
          &#9889; MEGA MILLIONS TRI-MODEL + TRACKER &#9889;
        </div>
        <div style={{fontSize:"8px",color:"#2a4a6a",letterSpacing:"0.15em",marginTop:"4px"}}>
          3 PREDICTION MODELS - {info.total.toLocaleString()} DRAWS - LIVE DATA - {history.length} TRACKED RESULT{history.length!==1?"S":""}

        <span style={mkLbl(t.p)}>Quantum Entanglement Model</span>
        <div style={{fontSize:"7px",color:"#2a1040",marginBottom:"10px",fontStyle:"italic"}}>
          psi(n) = sqrt(f/N)*exp(i*theta) | P = |psi|^2 * interference + tunneling + entanglement
        </div>
        <div style={{display:"flex",justifyContent:"center",gap:"10px",flexWrap:"wrap",marginBottom:"12px",alignItems:"flex-end"}}>
          {pred.main.map(function(n){
            var s=scores.filter(function(x){return x.num===n;})[0];
            var rank=sorted.findIndex(function(x){return x.num===n;})+1;
            return (
              <div key={n} style={{textAlign:"center"}}>
                <BallEl num={n} mi={2} size={60} showRank={true} rank={rank} freq={s&&s.freq}
                  selected={sel&&sel.mi===2&&sel.num===n}
                  onClick={function(){setSel(sel&&sel.num===n&&sel.mi===2?null:{mi:2,num:n});}}/>
                <div style={{fontSize:"7px",color:qsc(s&&s.state),marginTop:"2px",
                  animation:s&&s.state==="RESONANT"?"qFlick 3s ease-in-out infinite":"none"}}>{s&&s.state}</div>
              </div>
            );
          })}
          <div style={{borderLeft:"1px solid "+t.br,paddingLeft:"10px",marginLeft:"3px"}}>
            <div style={{fontSize:"6px",color:"#3a2000",marginBottom:"3px"}}>MEGA</div>
            <BallEl num={pred.mega} mi={2} isMega={true} size={60} freq={mbScores.filter(function(s){return s.num===pred.mega;})[0]&&mbScores.filter(function(s){return s.num===pred.mega;})[0].freq}/>
          </div>
        </div>
        <div style={{fontSize:"11px",color:t.p,letterSpacing:"0.12em",fontWeight:"bold"}}>{pred.main.join("  -  ")} + MB {pred.mega}</div>
      </div>
      <div style={mkPanel("quantum")}>
        <span style={mkLbl(t.s)}>Quantum State Field</span>
        <div style={{display:"grid",gridTemplateColumns:"repeat(10,1fr)",gap:"3px",marginBottom:"7px"}}>
          {scores.map(function(s){
            var isP=predSet[s.num],sCol=qsc(s.state),alpha=Math.min(s.score/maxS*1.4,1);
            return (
              <div key={s.num} className="bc"
                onClick={function(){setSel(sel&&sel.num===s.num&&sel.mi===2?null:{mi:2,num:s.num});}}
                style={{background:"rgba(30,0,50,"+(alpha*0.6)+")",border:"1px solid "+(isP?"#fff":sCol)+(isP?"":"44"),borderRadius:"4px",padding:"4px 1px",textAlign:"center",cursor:"pointer",position:"relative",transition:"transform 0.15s",animation:s.state==="RESONANT"?"qFlick 3.5s ease-in-out infinite":"none"}}>
                <div style={{fontSize:"clamp(8px,1.2vw,11px)",color:isP?"#fff":sCol,fontWeight:isP?"bold":"normal"}}>{s.num}</div>
                <div style={{fontSize:"6px",color:"#2a1040",marginTop:"1px"}}>{s.state==="RESONANT"?"~":s.state==="COLLAPSED"?"x":s.state==="DESTRUCTIVE"?"v":"o"}</div>
                {isP&&<div style={{position:"absolute",top:"-2px",right:"-2px",width:"5px",height:"5px",borderRadius:"50%",background:"#fff",animation:"pulse 1.5s ease-in-out infinite"}}/>}
              </div>
            );
          })}
        </div>
      </div>
      <div style={mkPanel("quantum")}>
        <span style={mkLbl(t.s)}>Top 15 by Quantum Score</span>
        {sorted.slice(0,15).map(function(s,i){
          var pct=(s.score/maxS)*100,sCol=qsc(s.state);
          return (
            <div key={s.num} onClick={function(){setSel(sel&&sel.num===s.num&&sel.mi===2?null:{mi:2,num:s.num});}}
              style={{marginBottom:"5px",display:"flex",alignItems:"center",gap:"6px",cursor:"pointer"}}>
              <div style={{width:"16px",fontSize:"7px",color:"#1e1040",textAlign:"right"}}>#{i+1}</div>
              <div style={{width:"20px",fontSize:"10px",fontWeight:"bold",textAlign:"center",color:predSet[s.num]?"#fff":t.p}}>{s.num}</div>
              <div style={{flex:1,height:"5px",background:"rgba(20,0,40,0.8)",borderRadius:"2px",overflow:"hidden"}}>
                <div style={{height:"100%",width:pct+"%",background:"linear-gradient(90deg,"+t.p+"55,"+t.p+")",borderRadius:"2px"}}/>
              </div>
              <div style={{width:"58px",fontSize:"7px",color:sCol,textAlign:"right"}}>{s.state}</div>
              <div style={{width:"40px",fontSize:"8px",color:"#3a2070",textAlign:"right"}}>{s.score.toFixed(3)}</div>
              <div style={{width:"8px",fontSize:"8px",color:"#ffd600"}}>{predSet[s.num]?"*":""}</div>
            </div>
          );
        })}
      </div>
      {det&&(
        <div style={{...mkPanel("quantum"),animation:"flowIn 0.25s ease"}}>
          <span style={mkLbl(t.p)}>Ball {det.num} - Quantum Metrics</span>
          <div style={{display:"flex",flexWrap:"wrap",gap:"14px"}}>
            <div style={{textAlign:"center",minWidth:"55px"}}>
              <div style={{fontSize:"26px",fontWeight:"900",color:t.p}}>{det.num}</div>
              <div style={{fontSize:"7px",color:"#1e1040"}}>{det.freq} draws</div>
              <div style={{fontSize:"7px",color:qsc(det.state),marginTop:"2px"}}>{det.state}</div>
              {det.entanglement>0&&<div style={{fontSize:"7px",color:t.p,marginTop:"1px"}}>ENTANGLED</div>}
            </div>
            <div style={{flex:1,display:"grid",gridTemplateColumns:"1fr 1fr",gap:"4px 14px"}}>
              {det.metrics&&det.metrics.map(function(row){
                return <div key={row[0]}><div style={{fontSize:"7px",color:"#1e1040",letterSpacing:"0.08em"}}>{row[0].toUpperCase()}</div><div style={{fontSize:"11px",color:t.p}}>{row[1]}</div></div>;
              })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// Mount
var rootEl=ReactDOM.createRoot(document.getElementById("root"));
rootEl.render(React.createElement(App,null));
setTimeout(function(){var l=document.getElementById("loading");if(l){l.style.opacity="0";setTimeout(function(){l.remove();},600);}},1400);
</script>
</body>
</html>
